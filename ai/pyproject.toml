[project]
name = "passql-ai"
version = "1.18.1"
description = "passQL AI Server - 문제·선택지 생성, 프롬프트 테스트, RAG 색인·추천·정리"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "pydantic-settings>=2.11.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "google-genai>=0.3.0",
    "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
