id: exp_set_union_count
topicCode: sql_basic_select
difficulty: 1
stem: 다음 SQL 의 실행 결과 행 수는?
tables:
  - name: A
    columns: [X]
    rows: [[1], [2], [2]]
  - name: B
    columns: [X]
    rows: [[2], [3]]
displaySql: |
  SELECT X FROM A
  UNION
  SELECT X FROM B
ddl: |
  CREATE TABLE A (X NUMBER);
  CREATE TABLE B (X NUMBER);
data: |
  INSERT INTO A VALUES (1);
  INSERT INTO A VALUES (2);
  INSERT INTO A VALUES (2);
  INSERT INTO B VALUES (2);
  INSERT INTO B VALUES (3);
answerSql: |
  SELECT COUNT(*) FROM (SELECT X FROM A UNION SELECT X FROM B)
choices:
  - body: "3"
    isCorrect: true
    rationale: UNION 은 중복을 제거해 1, 2, 3 세 행
    expect: {scalar: 3}
  - body: "5"
    rationale: UNION ALL 이면 중복 포함 5행
    expect: {scalar: 5}
  - body: "4"
    rationale: A 의 중복만 남기고 B 와의 중복만 지운 잘못된 계산
    expect: {scalar: 4}
  - body: "2"
    rationale: 두 테이블에 모두 있는 값(INTERSECT) 수는 1, 2 는 근거 없음
    expect: {scalar: 2}
