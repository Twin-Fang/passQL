id: exp_function_null_arith
topicCode: sql_function
difficulty: 2
stem: 다음 SQL 의 실행 결과는?
tables:
  - name: T
    columns: [ID, SAL, COMM]
    rows: [[1, 100, null], [2, 200, 50], [3, null, 30]]
displaySql: |
  SELECT SUM(SAL + COMM) FROM T
ddl: |
  CREATE TABLE T (ID NUMBER, SAL NUMBER, COMM NUMBER);
data: |
  INSERT INTO T VALUES (1, 100, NULL);
  INSERT INTO T VALUES (2, 200, 50);
  INSERT INTO T VALUES (3, NULL, 30);
answerSql: |
  SELECT SUM(SAL + COMM) FROM T
choices:
  - body: "250"
    isCorrect: true
    rationale: SAL + COMM 은 한쪽이 NULL 이면 NULL, 2번 행만 250 이고 SUM 은 NULL 을 제외
    expect: {scalar: 250}
  - body: "380"
    rationale: SUM(SAL) + SUM(COMM) 처럼 열별로 먼저 더했을 때 값
    expect: {scalar: 380}
  - body: "300"
    rationale: SAL 합계만 더한 값
    expect: {scalar: 300}
  - body: "NULL"
    rationale: SUM 은 NULL 행을 건너뛰므로 결과 전체가 NULL 이 되지 않음
    expect: {scalar: "NULL"}
