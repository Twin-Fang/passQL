id: exp_oracle_connect_by_reverse
topicCode: sql_hierarchy_pivot
difficulty: 3
stem: 다음 SQL 의 실행 결과는?
tables:
  - name: EMP
    columns: [EMPNO, MGR, ENAME]
    rows: [[1, null, KING], [2, 1, JONES], [3, 2, SCOTT], [4, 1, BLAKE]]
displaySql: |
  SELECT COUNT(*)
  FROM EMP
  START WITH ENAME = 'SCOTT'
  CONNECT BY PRIOR MGR = EMPNO
ddl: |
  CREATE TABLE EMP (EMPNO NUMBER, MGR NUMBER, ENAME VARCHAR2(10));
data: |
  INSERT INTO EMP VALUES (1, NULL, 'KING');
  INSERT INTO EMP VALUES (2, 1, 'JONES');
  INSERT INTO EMP VALUES (3, 2, 'SCOTT');
  INSERT INTO EMP VALUES (4, 1, 'BLAKE');
answerSql: |
  SELECT COUNT(*) FROM EMP START WITH ENAME = 'SCOTT' CONNECT BY PRIOR MGR = EMPNO
choices:
  - body: "1"
    rationale: PRIOR EMPNO = MGR (순방향)이었다면 SCOTT 아래 부하가 없어 1
    expect: {scalar: 1}
  - body: "2"
    rationale: KING 까지 올라가지 않고 한 단계에서 멈춘 계산
    expect: {scalar: 2}
  - body: "3"
    isCorrect: true
    rationale: PRIOR MGR = EMPNO 는 역방향, SCOTT > JONES > KING 3행
    expect: {scalar: 3}
  - body: "4"
    rationale: KING 에서 순방향으로 전체를 전개했을 때 행 수
    expect: {scalar: 4}
