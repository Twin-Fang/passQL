id: exp_oracle_rownum_topn
topicCode: sql_subquery
difficulty: 3
stem: Oracle 에서 급여가 가장 높은 사원 1명의 이름을 구하려고 한다. 항상 올바른 결과를 내는 SQL 은?
tables:
  - name: EMP
    columns: [ENAME, SAL]
    rows: [[A, 100], [B, 300], [C, 200]]
ddl: |
  CREATE TABLE EMP (ENAME VARCHAR2(10), SAL NUMBER);
data: |
  INSERT INTO EMP VALUES ('A', 100);
  INSERT INTO EMP VALUES ('B', 300);
  INSERT INTO EMP VALUES ('C', 200);
answerSql: |
  SELECT ENAME FROM EMP WHERE SAL = (SELECT MAX(SAL) FROM EMP)
choices:
  - kind: SQL
    body: SELECT ENAME FROM EMP WHERE ROWNUM = 1 ORDER BY SAL DESC
    rationale: ROWNUM 은 정렬 전에 매겨져 임의의 첫 행 1개를 고른 뒤 정렬
    expect: {same_as_answer: false}
  - kind: SQL
    body: SELECT ENAME FROM (SELECT ENAME FROM EMP ORDER BY SAL DESC) WHERE ROWNUM = 1
    isCorrect: true
    rationale: 인라인 뷰에서 먼저 정렬한 뒤 ROWNUM 1 을 잘라 최고 급여 B
    expect: {same_as_answer: true}
  - kind: SQL
    body: SELECT ENAME FROM (SELECT ENAME FROM EMP ORDER BY SAL DESC) WHERE ROWNUM = 2
    rationale: ROWNUM = 2 는 첫 행이 1 을 받지 못해 항상 0행
    expect: {same_as_answer: false}
  - kind: SQL
    body: SELECT ENAME FROM EMP WHERE SAL = (SELECT MIN(SAL) FROM EMP)
    rationale: MIN 은 가장 낮은 급여 A
    expect: {same_as_answer: false}
