id: exp_group_count_differs
topicCode: sql_group_aggregate
difficulty: 3
stem: 부서별로 보너스를 받은 사원 수를 구하려고 한다. 다음 SQL 중 실행 결과가 나머지와 다른 것은?
tables:
  - name: T
    columns: [DEPT, BONUS]
    rows: [[A, 10], [A, null], [B, null], [B, null], [C, 5]]
ddl: |
  CREATE TABLE T (DEPT VARCHAR2(5), BONUS NUMBER);
data: |
  INSERT INTO T VALUES ('A', 10);
  INSERT INTO T VALUES ('A', NULL);
  INSERT INTO T VALUES ('B', NULL);
  INSERT INTO T VALUES ('B', NULL);
  INSERT INTO T VALUES ('C', 5);
answerSql: |
  SELECT DEPT, COUNT(BONUS) FROM T GROUP BY DEPT ORDER BY DEPT
choices:
  - kind: SQL
    body: SELECT DEPT, COUNT(BONUS) FROM T GROUP BY DEPT ORDER BY DEPT
    rationale: COUNT(컬럼) 은 NULL 을 세지 않아 A 1, B 0, C 1
    expect: {same_as_answer: true}
  - kind: SQL
    body: SELECT DEPT, SUM(CASE WHEN BONUS IS NOT NULL THEN 1 ELSE 0 END) FROM T GROUP BY DEPT ORDER BY DEPT
    rationale: NULL 이 아닌 행만 1 로 더해 COUNT(BONUS) 와 같은 결과
    expect: {same_as_answer: true}
  - kind: SQL
    body: SELECT DEPT, COUNT(*) FROM T GROUP BY DEPT ORDER BY DEPT
    isCorrect: true
    rationale: COUNT(*) 는 NULL 행까지 세어 A 2, B 2, C 1 로 결과가 다름
    expect: {same_as_answer: false}
  - kind: SQL
    body: SELECT DEPT, COUNT(CASE WHEN BONUS IS NOT NULL THEN 1 END) FROM T GROUP BY DEPT ORDER BY DEPT
    rationale: 조건이 거짓이면 CASE 가 NULL 이 되어 COUNT 에서 빠지므로 같은 결과
    expect: {same_as_answer: true}
