id: exp_tcl_ddl_autocommit
topicCode: sql_ddl_dml_tcl
difficulty: 3
stem: Oracle 에서 테이블 T(X NUMBER) 가 비어 있을 때 다음 문장을 순서대로 실행했다. 마지막 SELECT 결과는?
displaySql: |
  INSERT INTO T VALUES (1);
  CREATE TABLE T2 (Y NUMBER);
  ROLLBACK;
  SELECT COUNT(*) FROM T;
ddl: |
  CREATE TABLE T (X NUMBER);
answerSql: |
  INSERT INTO T VALUES (1);
  CREATE TABLE T2 (Y NUMBER);
  ROLLBACK;
  SELECT COUNT(*) FROM T;
choices:
  - body: "0"
    rationale: ROLLBACK 이 INSERT 를 취소한다고 본 경우, 실제로는 DDL 이 먼저 커밋
    expect: {scalar: 0}
  - body: "1"
    isCorrect: true
    rationale: Oracle DDL(CREATE TABLE) 은 실행 전 자동 커밋, INSERT 가 확정되어 ROLLBACK 대상 아님
    expect: {scalar: 1}
  - body: 오류 발생
    rationale: 모든 문장은 정상 실행
    expect: {scalar: 오류 발생}
  - body: "2"
    rationale: INSERT 는 1번만 실행
    expect: {scalar: 2}
---
id: exp_model_second_normal_form
topicCode: data_modeling
difficulty: 2
stem: 제2정규형(2NF)에 대한 설명으로 옳은 것은?
sourceNote: 정규화 정의 (1NF 원자값, 2NF 부분 함수 종속 제거, 3NF 이행 함수 종속 제거, BCNF 결정자 후보키)
choices:
  - body: 기본키가 아닌 속성이 기본키 전체에 완전 함수 종속되도록 부분 함수 종속을 제거한다
    isCorrect: true
    rationale: 2NF 정의, 복합 기본키 일부에만 종속된 속성을 분리
    expect: {concept: true}
  - body: 기본키가 아닌 속성 사이의 이행적 함수 종속을 제거한다
    rationale: 이행 함수 종속 제거는 3NF
    expect: {concept: true}
  - body: 모든 속성 값이 원자값이 되도록 반복 그룹을 제거한다
    rationale: 원자값·반복 그룹 제거는 1NF
    expect: {concept: true}
  - body: 모든 결정자가 후보키가 되도록 분해한다
    rationale: 결정자가 모두 후보키여야 하는 것은 BCNF
    expect: {concept: true}
