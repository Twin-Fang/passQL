id: exp_join_left_outer_count
topicCode: sql_join
difficulty: 2
stem: 다음 SQL 의 실행 결과는?
tables:
  - name: DEPT
    columns: [DEPTNO, DNAME]
    rows: [[10, ACC], [20, RES], [30, SALES]]
  - name: EMP
    columns: [EMPNO, DEPTNO]
    rows: [[1, 10], [2, 10], [3, 20], [4, null]]
displaySql: |
  SELECT COUNT(*)
  FROM DEPT D LEFT OUTER JOIN EMP E ON D.DEPTNO = E.DEPTNO
ddl: |
  CREATE TABLE DEPT (DEPTNO NUMBER, DNAME VARCHAR2(10));
  CREATE TABLE EMP (EMPNO NUMBER, DEPTNO NUMBER);
data: |
  INSERT INTO DEPT VALUES (10, 'ACC');
  INSERT INTO DEPT VALUES (20, 'RES');
  INSERT INTO DEPT VALUES (30, 'SALES');
  INSERT INTO EMP VALUES (1, 10);
  INSERT INTO EMP VALUES (2, 10);
  INSERT INTO EMP VALUES (3, 20);
  INSERT INTO EMP VALUES (4, NULL);
answerSql: |
  SELECT COUNT(*) FROM DEPT D LEFT OUTER JOIN EMP E ON D.DEPTNO = E.DEPTNO
choices:
  - body: "3"
    rationale: INNER JOIN 결과 행 수 (짝 없는 SALES 제외)
    expect: {scalar: 3}
  - body: "4"
    isCorrect: true
    rationale: DEPT 기준 ACC 2행, RES 1행, 짝 없는 SALES 도 NULL 채워 1행 남아 4
    expect: {scalar: 4}
  - body: "5"
    rationale: FULL OUTER JOIN 이면 부서 없는 사원 4 까지 더해 5
    expect: {scalar: 5}
  - body: "2"
    rationale: 사원이 있는 부서 수일 뿐 조인 행 수가 아님
    expect: {scalar: 2}
