# AI 해설 하네스 샘플 문제 (#521)
# 형식: tools/sqld-question-harness/harness.py 문제 YAML (Oracle 실행으로 정답 검증 > samples/oracle-verified-import.json)
# 유형 분포: 결과값 묻기 5, '나머지와 다른 것' 1, 항상 올바른 SQL 1, 트랜잭션 1, 개념형 1
---
id: exp_window_dense_rank
topicCode: sql_window
difficulty: 2
stem: 다음 SQL 을 실행했을 때 CHOI 의 RNK 값은?
tables:
  - name: EMP
    columns: [ENAME, SAL]
    rows: [[KIM, 300], [LEE, 200], [PARK, 200], [CHOI, 100]]
displaySql: |
  SELECT ENAME, DENSE_RANK() OVER (ORDER BY SAL DESC) AS RNK
  FROM EMP
ddl: |
  CREATE TABLE EMP (ENAME VARCHAR2(10), SAL NUMBER);
data: |
  INSERT INTO EMP VALUES ('KIM', 300);
  INSERT INTO EMP VALUES ('LEE', 200);
  INSERT INTO EMP VALUES ('PARK', 200);
  INSERT INTO EMP VALUES ('CHOI', 100);
answerSql: |
  SELECT RNK FROM (SELECT ENAME, DENSE_RANK() OVER (ORDER BY SAL DESC) AS RNK FROM EMP) WHERE ENAME = 'CHOI'
choices:
  - body: "3"
    isCorrect: true
    rationale: DENSE_RANK 는 동점(LEE·PARK 2위) 뒤 순위를 건너뛰지 않아 CHOI 는 3
    expect: {scalar: 3}
  - body: "4"
    rationale: RANK 였다면 동점 2명 뒤 순위를 건너뛰어 4
    expect: {scalar: 4}
  - body: "2"
    rationale: 2 는 동점인 LEE·PARK 의 순위
    expect: {scalar: 2}
  - body: "1"
    rationale: 1 은 최고 급여 KIM 의 순위
    expect: {scalar: 1}
