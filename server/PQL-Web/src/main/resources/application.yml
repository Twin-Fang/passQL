spring:
  application:
    name: passql
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  profiles:
    active: prod
  output:
    ansi:
      # 컨테이너 로그에 색상 코드가 섞이면 grep·보관 파일 읽기가 어렵다 (#436)
      enabled: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    # DB가 이미 높은 버전까지 적용된 뒤 낮은 번호 마이그레이션이 늦게 추가되면
    # 기본 설정은 조용히 스킵함 (V0_0_95 로그인 장애 원인) — 반드시 유지
    out-of-order: true

# 모든 로그 줄 레벨 뒤에 [요청ID|회원ID]를 붙인다 — RequestTraceFilter·JwtAuthenticationFilter가 MDC를 채운다 (#436)
logging:
  pattern:
    level: "%5p [%X{rid:--}|%X{mid:--}]"

server:
  port: 8080
  # DSM 리버스 프록시의 X-Forwarded-Proto를 반영해야 리다이렉트가 https로 나간다 (#389)
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # 관리자 세션 쿠키를 HTTPS로만 전송하고 교차 사이트 전송을 막는다 (#389)
        secure: true
        same-site: lax

suhapilog:
  enabled: true
  github:
    base-url: "https://github.com/Twin-Fang/passQL/issues/"

# SSE 스트림 엔드포인트는 ContentCachingResponseWrapper 버퍼링으로 스트림이 망가지므로 로깅 제외
# suh-logger의 excludePatterns는 String.contains() 기반이므로 suffix 문자열만 지정
suh-logger:
  exclude-patterns:
    - "generate-choices"
    # 인증 응답 본문(액세스·리프레시 토큰, CSRF 토큰)이 로그에 평문으로 남지 않게 제외 (#396)
    - "auth/login"
    - "auth/reissue"
    - "admin/login"
    # Docker 헬스체크(5초 간격)가 요청 로그의 99%를 차지해 실제 요청이 묻힌다 (#436)
    - "actuator/health"

springdoc:
  swagger-ui:
    path: /docs/swagger
  api-docs:
    path: /docs/api-docs
  packages-to-scan: com.passql
  paths-to-match: /api/**

admin:
  username: ${ADMIN_USERNAME:admin}
  password-hash: ${ADMIN_PASSWORD_HASH:}
