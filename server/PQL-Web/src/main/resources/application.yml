spring:
  application:
    name: passql
  servlet:
    multipart:
      # 의견 첨부: 파일 1개 최대 2MB(로그 gzip), 요청 전체 10MB (이미지 10장 + 진단 + 로그)
      max-file-size: 2MB
      max-request-size: 10MB
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  profiles:
    active: prod
  output:
    ansi:
      # 컨테이너 로그에 색상 코드가 섞이면 grep·보관 파일 읽기가 어렵다 (#436)
      enabled: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    # DB가 이미 높은 버전까지 적용된 뒤 낮은 번호 마이그레이션이 늦게 추가되면
    # 기본 설정은 조용히 스킵함 (V0_0_95 로그인 장애 원인) — 반드시 유지
    out-of-order: true

# 로그 형식(패턴·prod JSON)은 logback-spring.xml 한 곳에서 관리 (#476)

server:
  port: 8080
  # DSM 리버스 프록시의 X-Forwarded-Proto를 반영해야 리다이렉트가 https로 나간다 (#389)
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # 관리자 세션 쿠키를 HTTPS로만 전송하고 교차 사이트 전송을 막는다 (#389)
        secure: true
        same-site: lax

suhapilog:
  enabled: true
  github:
    base-url: "https://github.com/Twin-Fang/passQL/issues/"

# SSE 스트림 엔드포인트는 ContentCachingResponseWrapper 버퍼링으로 스트림이 망가지므로 로깅 제외
# suh-logger의 excludePatterns는 String.contains() 기반이므로 suffix 문자열만 지정
suh-logger:
  exclude-patterns:
    - "generate-choices"
    # 인증 응답 본문(액세스·리프레시 토큰, CSRF 토큰)이 로그에 평문으로 남지 않게 제외 (#396)
    - "auth/login"
    - "auth/reissue"
    - "admin/login"
    # Docker 헬스체크(5초 간격)가 요청 로그의 99%를 차지해 실제 요청이 묻힌다 (#436)
    - "actuator/health"

springdoc:
  swagger-ui:
    path: /docs/swagger
  api-docs:
    path: /docs/api-docs
  packages-to-scan: com.passql
  paths-to-match: /api/**

admin:
  username: ${ADMIN_USERNAME:admin}
  password-hash: ${ADMIN_PASSWORD_HASH:}

# 인가 코드 로그인 (#509): client-id 가 비면 그 제공자는 "준비 중". 키는 application-prod.yml 또는 환경변수로만 넣는다.
# allowed-redirect-uris: 운영 웹 콜백({origin}/auth/callback/{provider})과 앱 콜백(passql://), 이 목록 밖 주소로는 코드를 교환하지 않는다.
# 토큰 출처 검증·연결 해제 (#516): kakao.app-id(토큰 app_id 비교, 비면 카카오 토큰 로그인 503), kakao.admin-key(탈퇴 시 연결 끊기),
#   naver.allowed-client-ids(토큰 client_id 허용 목록, 비면 naver.client-id 만)
# local-redirect-uris: 로컬 개발 웹 콜백 (아래 dev 프로필 문서에서만 채움, 운영 기본값은 빈 목록)
social-login:
  local-redirect-uris: ${SOCIAL_LOGIN_LOCAL_REDIRECT_URIS:}
  kakao:
    client-id: ${SOCIAL_LOGIN_KAKAO_CLIENT_ID:}
    client-secret: ${SOCIAL_LOGIN_KAKAO_CLIENT_SECRET:}
    app-id: ${SOCIAL_LOGIN_KAKAO_APP_ID:}
    admin-key: ${SOCIAL_LOGIN_KAKAO_ADMIN_KEY:}
    allowed-redirect-uris:
      - https://passql.vercel.app/auth/callback/kakao
  naver:
    client-id: ${SOCIAL_LOGIN_NAVER_CLIENT_ID:}
    client-secret: ${SOCIAL_LOGIN_NAVER_CLIENT_SECRET:}
    allowed-client-ids: ${SOCIAL_LOGIN_NAVER_ALLOWED_CLIENT_IDS:}
    allowed-redirect-uris:
      - https://passql.vercel.app/auth/callback/naver
  github:
    client-id: ${SOCIAL_LOGIN_GITHUB_CLIENT_ID:}
    client-secret: ${SOCIAL_LOGIN_GITHUB_CLIENT_SECRET:}
    allowed-redirect-uris:
      - https://passql.vercel.app/auth/callback/github
      # 앱(iOS·Android) 인증 세션 콜백 (#509)
      - passql://auth/callback/github

# AI 서버 호출 재시도 판정 (#699): 연결 실패만 재시도, 횟수·간격은 프로필 설정(max-attempts·wait-duration)
# 서버 응답 오류는 AI 서버가 LLM 일시 오류를 이미 재시도해 다시 부르면 호출이 겹침
resilience4j:
  retry:
    instances:
      aiServer:
        retry-exception-predicate: com.passql.ai.client.AiServerRetryPredicate

---
# 로컬 개발(dev 프로필) 전용: Vite 개발 서버 콜백 허용 (#516, 운영 prod 프로필에는 적용되지 않음)
spring:
  config:
    activate:
      on-profile: dev
social-login:
  local-redirect-uris:
    - http://localhost:5173/auth/callback/kakao
    - http://localhost:5173/auth/callback/naver
    - http://localhost:5173/auth/callback/github
