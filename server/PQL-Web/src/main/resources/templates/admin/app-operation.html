<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">

<th:block layout:fragment="title">앱 운영</th:block>

<th:block layout:fragment="content">
    <div class="space-y-4">

        <th:block th:replace="~{admin/fragments/app-operation-settings :: settings-card}"></th:block>

        <th:block th:replace="~{admin/fragments/app-operation-billing :: billing-card}"></th:block>

        <th:block th:replace="~{admin/fragments/app-operation-lockscreen :: lockscreen-card}"></th:block>

        <th:block th:replace="~{admin/fragments/app-operation-notices :: notice-card}"></th:block>
    </div>

    <!-- 앱 운영 설정 변경 이력 (감사 로그 중 이 화면 전용 키: 점검·버전·결제 스위치·미리보기 회원) -->
    <div class="card bg-base-100 shadow mt-4">
        <div class="card-body p-4">
            <h3 class="card-title text-base"><i data-lucide="history" class="size-5"></i>설정 변경 이력 (최근 30건)</h3>
            <div class="overflow-x-auto">
                <table class="table table-sm">
                    <thead>
                    <tr><th class="w-36">시각</th><th class="w-24">관리자</th><th class="w-56">설정 키</th><th>변경 (전 > 후)</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="change : ${settingChanges}">
                        <td class="text-xs font-mono" th:text="${#temporals.format(change.occurredAt, 'yyyy-MM-dd HH:mm')}">2026-10-24 10:00</td>
                        <td class="text-xs"><a class="link link-hover" th:href="@{/admin/audit-logs(adminUsername=${change.adminUsername})}" th:text="${change.adminUsername}">admin</a></td>
                        <td class="text-xs font-mono" th:text="${change.targetId}">app.maintenance.enabled</td>
                        <td class="text-xs font-mono break-all" th:text="${change.changeSummaryJson}">{}</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(settingChanges)}">
                        <td colspan="4" class="text-center text-base-content/50 py-6">변경 이력이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <th:block th:replace="~{admin/fragments/app-operation-notices :: notice-modal}"></th:block>

    <!-- 저장 결과 알림 -->
    <div id="toast" class="toast toast-end hidden z-50">
        <div id="toastAlert" class="alert alert-success">
            <span id="toastMessage"></span>
        </div>
    </div>
</th:block>

<th:block layout:fragment="js">
    <script th:src="@{/js/admin/app-operation-billing.js}"></script>
    <script th:src="@{/js/admin/app-operation-lockscreen.js}"></script>
    <script>lucide.createIcons();</script>
    <script th:src="@{/js/admin/app-operation-settings.js}"></script>
    <script th:src="@{/js/admin/app-operation-notices.js}"></script>
</th:block>
</html>
