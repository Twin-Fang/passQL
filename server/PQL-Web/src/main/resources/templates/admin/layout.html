<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      data-theme="light">
<head>
    <meta charset="utf-8"/>
    <title>passQL Admin | <th:block layout:fragment="title">Dashboard</th:block></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"/>

    <!-- 테마 초기화: 저장값 우선, 없으면 OS 설정(prefers-color-scheme), 렌더 전에 적용해 깜빡임 방지 -->
    <script>
        (function () {
            let savedTheme = null;
            try { savedTheme = localStorage.getItem('theme'); } catch (ignored) { }
            const isOsDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', savedTheme || (isOsDark ? 'dark' : 'light'));
        })();
    </script>

    <!-- DaisyUI 5 · Tailwind CSS 4 · Lucide (로컬 번들, 버전 갱신은 static/vendor/admin 파일 교체) -->
    <link th:href="@{/vendor/admin/daisyui-5.css}" rel="stylesheet" type="text/css"/>
    <script th:src="@{/vendor/admin/tailwindcss-browser-4.js}"></script>
    <script th:src="@{/vendor/admin/lucide-1.52.0.min.js}"></script>

    <!-- CSRF 토큰 (fetch PUT/POST 요청에 사용) -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <!-- 관리자 공통 (CSRF 부착, AdminApi 요청, AdminUi 토스트·확인 창) — 페이지 스크립트보다 먼저 실행 -->
    <script th:src="@{/js/admin/admin-fetch.js}"></script>

    <!-- Additional CSS -->
    <th:block layout:fragment="css"></th:block>
</head>
<body class="min-h-screen bg-base-200">

<!-- Drawer Layout -->
<div class="drawer lg:drawer-open">
    <input id="drawer-toggle" type="checkbox" class="drawer-toggle"/>

    <!-- Main Content -->
    <div class="drawer-content flex flex-col">
        <!-- Navbar -->
        <div class="navbar bg-base-100 shadow-sm sticky top-0 z-30">
            <!-- Mobile menu button -->
            <div class="flex-none lg:hidden">
                <label for="drawer-toggle" class="btn btn-square btn-ghost">
                    <i data-lucide="menu" class="size-5"></i>
                </label>
            </div>

            <!-- Page title -->
            <div class="flex-1">
                <h1 class="text-lg font-bold px-2" th:text="${pageTitle}">Dashboard</h1>
            </div>

            <!-- Right side -->
            <div class="flex-none flex items-center gap-2">
                <!-- 로그인 관리자 (VIEWER 는 조회 전용 표시) -->
                <span th:if="${currentAdminUsername}" class="hidden sm:inline text-sm text-base-content/70" th:text="${currentAdminUsername}">admin</span>
                <span th:if="${canWriteAdmin == false}" class="badge badge-warning badge-sm">조회 전용</span>
                <!-- Dark mode toggle -->
                <label class="swap swap-rotate btn btn-ghost btn-circle">
                    <input type="checkbox" id="themeToggle"/>
                    <i data-lucide="sun" class="swap-off size-5"></i>
                    <i data-lucide="moon" class="swap-on size-5"></i>
                </label>

                <!-- 로그아웃 -->
                <form th:action="@{/admin/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}"/>
                    <button type="submit" class="btn btn-ghost btn-sm gap-1">
                        <i data-lucide="log-out" class="size-4"></i>
                        <span class="hidden sm:inline">로그아웃</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Page Content -->
        <main class="p-4 lg:p-6 flex-1">
            <!-- 리다이렉트 후 저장 성공 토스트 (AdminFlash.TOAST_MESSAGE) -->
            <div id="adminFlashToast" hidden th:if="${toastMessage}" th:data-message="${toastMessage}"></div>
            <th:block layout:fragment="content"></th:block>
        </main>

        <!-- Footer -->
        <footer class="footer footer-center p-4 bg-base-100 text-base-content border-t border-base-300">
            <aside>
                <p>&copy; 2026 passQL. All rights reserved.</p>
            </aside>
        </footer>
    </div>

    <!-- Sidebar -->
    <div class="drawer-side z-40">
        <label for="drawer-toggle" aria-label="close sidebar" class="drawer-overlay"></label>
        <aside class="bg-base-100 min-h-full w-64 border-r border-base-300">
            <!-- Logo -->
            <div class="flex items-center gap-3 px-4 py-4 border-b border-base-300">
                <!-- 테마별 로고 (data-theme: light 기본 로고, dark pass 흰색 로고) -->
                <img th:src="@{/images/logo.png}" alt="passQL" class="h-8 w-auto [[data-theme=dark]_&]:hidden"/>
                <img th:src="@{/images/logo_dark.png}" alt="passQL" class="h-8 w-auto hidden [[data-theme=dark]_&]:block"/>
                <span class="badge badge-primary badge-sm">Admin</span>
            </div>

            <!-- 전역 검색: 회원·문제 UUID, 회원 닉네임 (결과 1건이면 바로 상세) -->
            <form th:action="@{/admin/search}" method="get" class="px-4 pt-4" role="search">
                <label class="input input-sm input-bordered flex items-center gap-2 w-full">
                    <i data-lucide="search" class="size-4 opacity-60"></i>
                    <input type="search" name="q" class="grow" placeholder="회원·문제 UUID, 닉네임" autocomplete="off"
                           aria-label="전역 검색"/>
                </label>
            </form>

            <!-- Menu: 그룹·항목은 AdminSidebar 단일 원본, 활성 코드는 AdminMenu.code 와 같게, 뱃지는 미처리 건수 -->
            <ul class="menu w-full p-4 gap-0.5 [&_.active]:bg-base-300 [&_.active]:text-base-content [&_.active]:font-semibold" id="sidebarMenu">
                <th:block th:each="group : ${sidebarGroups}">
                    <li class="menu-title" th:text="${group.title}">그룹</li>
                    <li th:each="item : ${group.items}" th:if="${!item.isWriteOnly() or canWriteAdmin}">
                        <a th:href="@{${item.path}}" th:classappend="${currentMenu == item.menuCode} ? 'active'">
                            <i th:attr="data-lucide=${item.iconName}" class="size-5"></i>
                            <span th:text="${item.label}">메뉴</span>
                            <!-- 미처리 건수 (0건이면 숨김) -->
                            <span th:if="${sidebarBadgeCounts != null and sidebarBadgeCounts[item.menuCode] != null and sidebarBadgeCounts[item.menuCode] > 0}"
                                  class="badge badge-warning badge-sm ml-auto"
                                  th:text="${sidebarBadgeCounts[item.menuCode] > 99} ? '99+' : ${sidebarBadgeCounts[item.menuCode]}">3</span>
                        </a>
                    </li>
                </th:block>
                <div class="divider my-1"></div>
                <li>
                    <a href="/docs/swagger" target="_blank">
                        <i data-lucide="file-code-2" class="size-5"></i>
                        Swagger API 문서
                        <i data-lucide="external-link" class="size-3 ml-auto opacity-40"></i>
                    </a>
                </li>
            </ul>
        </aside>
    </div>
</div>

<!-- Initialize Lucide Icons -->
<script>
    lucide.createIcons();

    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    // 초기 테마는 head 스크립트가 이미 적용 (저장값 우선, 없으면 OS 설정)
    themeToggle.checked = html.getAttribute('data-theme') === 'dark';
    themeToggle.addEventListener('change', () => {
        const theme = themeToggle.checked ? 'dark' : 'light';
        html.setAttribute('data-theme', theme);
        try { localStorage.setItem('theme', theme); } catch (ignored) { }
    });
    // 저장값이 없으면 OS 설정 변경을 따라감 (사용자가 토글하면 저장되어 고정)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
        let hasSavedTheme = false;
        try { hasSavedTheme = localStorage.getItem('theme') !== null; } catch (ignored) { }
        if (hasSavedTheme) return;
        html.setAttribute('data-theme', event.matches ? 'dark' : 'light');
        themeToggle.checked = event.matches;
    });
</script>

<!-- Additional JS -->
<th:block layout:fragment="js"></th:block>
</body>
</html>
