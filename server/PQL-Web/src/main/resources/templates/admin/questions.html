<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">

<th:block layout:fragment="title">문제 관리</th:block>

<th:block layout:fragment="content">

    <!-- 필터 & 액션 바 -->
    <div class="card bg-base-100 shadow mb-4">
        <div class="card-body p-4">
            <form th:action="@{/admin/questions}" method="get" class="flex flex-wrap gap-3 items-end">
                <!-- 토픽 필터 -->
                <div class="form-control">
                    <label class="label label-text text-xs">토픽</label>
                    <select name="topic" class="select select-sm select-bordered w-40">
                        <option value="">전체</option>
                        <option th:each="topic : ${topics}"
                                th:value="${topic.code}"
                                th:text="${topic.displayName}"
                                th:selected="${param.topic == topic.code}">SELECT</option>
                    </select>
                </div>

                <!-- 난이도 필터 -->
                <div class="form-control">
                    <label class="label label-text text-xs">난이도</label>
                    <select name="difficulty" class="select select-sm select-bordered w-32">
                        <option value="">전체</option>
                        <option th:each="d : ${#numbers.sequence(1, 5)}"
                                th:value="${d}"
                                th:text="'Lv.' + ${d}"
                                th:selected="${param.difficulty == d}">Lv.1</option>
                    </select>
                </div>

                <!-- 실행모드 필터 -->
                <div class="form-control">
                    <label class="label label-text text-xs">실행 모드</label>
                    <select name="executionMode" class="select select-sm select-bordered w-40">
                        <option value="">전체</option>
                        <option value="EXECUTABLE" th:selected="${param.executionMode == 'EXECUTABLE'}">실행형</option>
                        <option value="CONCEPT_ONLY" th:selected="${param.executionMode == 'CONCEPT_ONLY'}">개념형</option>
                    </select>
                </div>

                <!-- 활성 여부 필터 (비활성 = 삭제 처리된 문제, 복구 가능) -->
                <div class="form-control">
                    <label class="label label-text text-xs">상태</label>
                    <select name="activeState" class="select select-sm select-bordered w-28">
                        <option value="ACTIVE" th:selected="${condition.activeState == null or condition.activeState == 'ACTIVE'}">활성</option>
                        <option value="INACTIVE" th:selected="${condition.activeState == 'INACTIVE'}">비활성</option>
                        <option value="ALL" th:selected="${condition.activeState == 'ALL'}">전체</option>
                    </select>
                </div>

                <!-- 지문 검색 (부분 일치, 대소문자 무시) -->
                <div class="form-control">
                    <label class="label label-text text-xs">지문 검색</label>
                    <input type="text" name="keyword" class="input input-sm input-bordered w-48"
                           th:value="${condition.keyword}" placeholder="예: GROUP BY"/>
                </div>

                <button type="submit" class="btn btn-sm btn-primary">
                    <i data-lucide="search" class="size-4"></i>
                    검색
                </button>
                <a th:href="@{/admin/questions}" class="btn btn-sm btn-ghost">초기화</a>

                <!-- 좁은 폭에서는 액션 버튼도 줄바꿈 (#409) -->
                <div class="ml-auto flex flex-wrap gap-2 items-center">
                    <!-- 선택 색인 버튼: 체크박스 선택 시 활성화 -->
                    <button type="button" id="indexSelectedBtn" class="btn btn-sm btn-warning btn-outline" onclick="indexSelected()" disabled>
                        <i data-lucide="zap" class="size-4"></i>
                        <span id="indexSelectedLabel">선택 색인</span>
                    </button>

                    <!-- 선택 비활성화 버튼: 체크박스 선택 시 활성화 (회원 기록 보존) -->
                    <button type="button" id="deleteSelectedBtn" class="btn btn-sm btn-error btn-outline" onclick="deleteSelected()" disabled>
                        <i data-lucide="eye-off" class="size-4"></i>
                        <span id="deleteSelectedLabel">선택 비활성화</span>
                    </button>

                    <!-- JSON 내보내기/가져오기 드롭다운 -->
                    <div class="dropdown dropdown-end">
                        <label tabindex="0" class="btn btn-sm btn-outline">
                            <i data-lucide="database" class="size-4"></i>
                            JSON
                            <i data-lucide="chevron-down" class="size-3"></i>
                        </label>
                        <ul tabindex="0" class="dropdown-content menu menu-sm shadow bg-base-100 rounded-box w-52 z-50 mt-1">
                            <li>
                                <button type="button" onclick="openImportFileDialog()">
                                    <i data-lucide="upload" class="size-4"></i>
                                    JSON 파일 가져오기
                                </button>
                            </li>
                            <li>
                                <button type="button" onclick="openBulkPasteModal()">
                                    <i data-lucide="clipboard-paste" class="size-4"></i>
                                    JSON 붙여넣기
                                </button>
                            </li>
                            <li>
                                <button type="button" onclick="exportByFilter()">
                                    <i data-lucide="download" class="size-4"></i>
                                    필터 전체 내보내기
                                </button>
                            </li>
                            <li>
                                <button type="button" id="exportSelectedBtn" onclick="exportSelected()" disabled>
                                    <i data-lucide="check-square" class="size-4"></i>
                                    <span id="exportSelectedLabel">선택 내보내기</span>
                                </button>
                            </li>
                            <li><hr class="border-base-300 my-1"/></li>
                            <li>
                                <button type="button" onclick="openBulkGuideModal()">
                                    <i data-lucide="help-circle" class="size-4"></i>
                                    대량 JSON 가이드
                                </button>
                            </li>
                        </ul>
                    </div>

                    <!-- 주요 액션 버튼 -->
                    <a th:href="@{/admin/questions/register}" class="btn btn-sm btn-primary">
                        <i data-lucide="pencil" class="size-4"></i>
                        직접 등록
                    </a>
                    <a th:href="@{/admin/questions/new}" class="btn btn-sm btn-success">
                        <i data-lucide="sparkles" class="size-4"></i>
                        AI 생성
                    </a>
                    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="handleImportFile(event)"/>
                </div>
            </form>
        </div>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success mb-4">
        <i data-lucide="check-circle" class="size-5"></i>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-error mb-4">
        <i data-lucide="alert-circle" class="size-5"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- 문제 목록 테이블 -->
    <div class="card bg-base-100 shadow">
        <div class="card-body p-0">
            <div class="overflow-x-auto">
                <table class="table table-sm">
                    <thead>
                    <tr>
                        <th class="w-10"><input type="checkbox" id="selectAllCheckbox" class="checkbox checkbox-xs" onchange="toggleSelectAll(this)"/></th>
                        <th class="w-16">ID</th>
                        <th>지문 (50자)</th>
                        <th class="w-28">토픽</th>
                        <th class="w-20">난이도</th>
                        <th class="w-28">실행 모드</th>
                        <th class="w-20">상태</th>
                        <th class="w-32">생성일</th>
                        <th class="w-24">관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="q : ${questions}" th:if="${questions != null and !questions.isEmpty()}"
                        class="cursor-pointer hover:bg-base-200"
                        th:data-href="@{/admin/questions/{uuid}(uuid=${q.questionUuid})}"
                        onclick="if(!event.target.closest('input,a,button')) location.href=this.dataset.href">
                        <td onclick="event.stopPropagation()">
                            <input type="checkbox" class="checkbox checkbox-xs question-checkbox" th:data-uuid="${q.questionUuid}" onchange="onCheckboxChange()"/>
                        </td>
                        <td class="font-mono text-xs" th:text="${#strings.substring(q.questionUuid.toString(), 0, 8)}">xxxxxxxx</td>
                        <td class="max-w-xs truncate text-sm" th:text="${q.stemPreview}">
                            다음 중 employees 테이블에서 부서별 평균 급여를...
                        </td>
                        <td>
                            <span class="badge badge-outline badge-sm" th:text="${q.topicCode ?: q.topicName}">SELECT</span>
                        </td>
                        <td>
                            <span th:classappend="${q.difficulty == 1} ? 'badge-success' : (${q.difficulty == 2} ? 'badge-info' : (${q.difficulty == 3} ? 'badge-warning' : 'badge-error'))"
                                  class="badge badge-sm"
                                  th:text="'Lv.' + ${q.difficulty}">Lv.3</span>
                        </td>
                        <td>
                            <span th:classappend="${q.executionMode != null and q.executionMode.name() == 'EXECUTABLE'} ? 'badge-primary' : 'badge-ghost'"
                                  class="badge badge-sm"
                                  th:text="${q.executionMode != null and q.executionMode.name() == 'EXECUTABLE'} ? '실행형' : '개념형'">개념형</span>
                        </td>
                        <td>
                            <span th:if="${q.isActive}" class="badge badge-success badge-sm">활성</span>
                            <span th:unless="${q.isActive}" class="badge badge-ghost badge-sm">비활성</span>
                        </td>
                        <td class="text-xs" th:text="${q.createdAt != null ? #temporals.format(q.createdAt, 'yyyy-MM-dd') : '-'}">2026-04-01</td>
                        <td onclick="event.stopPropagation()" class="flex gap-1">
                            <a th:href="@{/admin/questions/{uuid}/edit(uuid=${q.questionUuid})}"
                               class="btn btn-xs btn-ghost" title="편집">
                                <i data-lucide="pencil" class="size-3"></i>
                            </a>
                            <button th:unless="${q.isActive}" type="button" class="btn btn-xs btn-success btn-outline"
                                    th:data-uuid="${q.questionUuid}" onclick="restoreQuestion(this.dataset.uuid)">복구</button>
                        </td>
                    </tr>

                    <!-- Empty state -->
                    <tr th:if="${questions == null or questions.isEmpty()}">
                        <td colspan="9" class="text-center text-base-content/50 py-12">
                            <i data-lucide="file-x" class="size-10 mx-auto mb-2 opacity-40"></i>
                            <p>문제가 없습니다.</p>
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="flex justify-center p-4" th:if="${questions != null and questions.totalPages > 1}">
                <div class="join">
                    <a th:href="@{/admin/questions(page=${questions.number - 1}, topic=${condition.topic}, difficulty=${condition.difficulty}, executionMode=${condition.executionMode}, keyword=${condition.keyword}, activeState=${condition.activeState})}"
                       class="join-item btn btn-sm"
                       th:classappend="${questions.first} ? 'btn-disabled'">«</a>
                    <button class="join-item btn btn-sm btn-active"
                            th:text="${questions.number + 1} + ' / ' + ${questions.totalPages}">1 / 10</button>
                    <a th:href="@{/admin/questions(page=${questions.number + 1}, topic=${condition.topic}, difficulty=${condition.difficulty}, executionMode=${condition.executionMode}, keyword=${condition.keyword}, activeState=${condition.activeState})}"
                       class="join-item btn btn-sm"
                       th:classappend="${questions.last} ? 'btn-disabled'">»</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 모달 (비활성화 확인, 대량 JSON 가이드, 붙여넣기, 가져오기 검증) -->
    <th:block th:replace="~{admin/fragments/question-list-modals :: modals}"></th:block>

</th:block>

<th:block layout:fragment="js">
<script th:src="@{/js/admin/question-import-export.js}"></script>
<script th:src="@{/js/admin/question-list.js}"></script>
<script th:src="@{/js/admin/question-activation.js}"></script>
<script>lucide.createIcons();</script>
</th:block>
</html>
