<!doctype html>
<!-- 회원 상세 등급 조각 2종: 등급·부여·회수 카드, 구매 이력 표 (구매 토큰은 표시하지 않음) -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="entitlement-card">
    <div class="card bg-base-100 shadow" th:with="today=${entitlement.todayInServiceZone}">
        <div class="card-body gap-3">
            <h3 class="font-bold text-sm text-base-content/70 uppercase tracking-wider">등급 (프로 / 무료)</h3>

            <div th:if="${entitlementErrorMessage}" class="alert alert-error py-2 text-sm">
                <i data-lucide="alert-circle" class="size-4"></i>
                <span th:text="${entitlementErrorMessage}">오류</span>
            </div>

            <div class="flex flex-wrap items-center gap-6">
                <div class="info-row">
                    <span class="info-label">현재 등급</span>
                    <span class="info-value">
                        <span th:if="${entitlement.isActivePro()}" class="badge badge-primary font-semibold">PRO</span>
                        <span th:unless="${entitlement.isActivePro()}" class="badge badge-ghost font-semibold">FREE</span>
                    </span>
                </div>
                <div class="info-row">
                    <span class="info-label">만료일</span>
                    <span class="info-value"
                          th:text="${entitlement.expiresAt != null ? #temporals.format(entitlement.expiresAt, 'yyyy-MM-dd HH:mm') : '—'}">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">부여 경로</span>
                    <span class="info-value" th:text="${entitlement.isActivePro() and entitlement.source != null ? entitlement.source.name() : '—'}">—</span>
                </div>
            </div>

            <div class="divider my-0"></div>

            <!-- 프로 부여: 선택한 날짜 23:59:59(KST) 까지, 활성 이용권보다 이른 날짜면 confirm (단축 허용) -->
            <form th:action="@{/admin/members/{uuid}/entitlement/grant(uuid=${member.memberUuid})}" method="post"
                  class="flex flex-wrap items-end gap-3"
                  th:attr="data-current-expires-date=${entitlement.isActivePro() ? #temporals.format(entitlement.expiresAt, 'yyyy-MM-dd') : ''}"
                  onsubmit="var currentDate = this.dataset.currentExpiresDate; return !currentDate || this.expiresDate.value >= currentDate || confirm('현재 이용권(' + currentDate + ')보다 짧아져요. 계속할까요?');">
                <div class="form-control">
                    <label class="label py-1"><span class="label-text text-xs">프로 만료일 (해당 날짜 23:59:59 까지)</span></label>
                    <input type="date" name="expiresDate" required th:min="${today}"
                           class="input input-bordered input-sm"/>
                </div>
                <button type="submit" class="btn btn-primary btn-sm gap-2">
                    <i data-lucide="badge-check" class="size-4"></i>프로 부여
                </button>
            </form>

            <!-- 프로 회수 -->
            <form th:if="${entitlement.isActivePro()}"
                  th:action="@{/admin/members/{uuid}/entitlement/revoke(uuid=${member.memberUuid})}" method="post"
                  onsubmit="return confirm('이 회원의 프로를 회수할까요?');">
                <button type="submit" class="btn btn-outline btn-error btn-sm gap-2">
                    <i data-lucide="badge-x" class="size-4"></i>프로 회수
                </button>
            </form>
        </div>
    </div>
</th:block>

<th:block th:fragment="purchase-panel">
    <div id="panel-purchase" class="p-4 hidden">
        <div class="overflow-x-auto">
            <table class="table table-sm">
                <thead>
                <tr>
                    <th class="w-20">스토어</th>
                    <th>상품</th>
                    <th>주문 번호</th>
                    <th class="w-36">구매일</th>
                    <th class="w-24">상태</th>
                    <th class="w-36">부여 만료일</th>
                    <th class="w-20">소모</th>
                    <th class="w-20"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${entitlement.purchases}">
                    <td class="text-xs" th:text="${p.store().name()}">PLAY</td>
                    <td class="font-mono text-xs" th:text="${p.productId()}">pro_exam_pass</td>
                    <td class="font-mono text-xs break-all" th:text="${p.orderId()}">GPA.0000</td>
                    <td class="text-xs text-base-content/60"
                        th:text="${#temporals.format(p.purchasedAt(), 'yyyy-MM-dd HH:mm')}">—</td>
                    <td>
                        <span class="badge badge-sm font-semibold"
                              th:classappend="${p.status().name() == 'VERIFIED'} ? 'badge-success' : 'badge-ghost'"
                              th:text="${p.status().name()}">VERIFIED</span>
                    </td>
                    <td class="text-xs text-base-content/60"
                        th:text="${p.grantedExpiresAt() != null ? #temporals.format(p.grantedExpiresAt(), 'yyyy-MM-dd HH:mm') : '—'}">—</td>
                    <td class="text-xs" th:text="${p.isConsumed() ? '완료' : '대기'}">완료</td>
                    <td>
                        <!-- 구매 1건 회수: 검증 상태만, 회원 등급 재계산 -->
                        <form th:if="${p.status().name() == 'VERIFIED'}"
                              th:action="@{/admin/members/{uuid}/entitlement/purchases/{purchaseUuid}/revoke(uuid=${member.memberUuid},purchaseUuid=${p.entitlementPurchaseUuid()})}"
                              method="post"
                              onsubmit="return confirm('이 구매를 회수할까요? 회원 이용권이 다시 계산됩니다.');">
                            <button type="submit" class="btn btn-ghost btn-xs text-error">회수</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${entitlement.purchases.isEmpty()}">
                    <td colspan="8" class="text-center text-base-content/40 py-12">
                        <div class="flex flex-col items-center gap-2">
                            <i data-lucide="inbox" class="size-8 opacity-30"></i>
                            <span>구매 이력이 없습니다.</span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</html>
