<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">

<th:block layout:fragment="title">신고 상세</th:block>

<th:block layout:fragment="content">

    <!-- 뒤로가기 -->
    <div class="mb-4">
        <a href="/admin/reports" class="btn btn-sm btn-ghost gap-1">
            <i data-lucide="arrow-left" class="size-4"></i>
            신고 목록으로
        </a>
    </div>

    <!-- 문제 정보 카드 -->
    <div id="questionCard" class="card bg-base-100 shadow mb-4">
        <div class="card-body">
            <div class="flex items-start gap-3">
                <span class="loading loading-spinner loading-sm mt-1"></span>
                <span class="text-base-content/50">문제 정보 로딩 중...</span>
            </div>
        </div>
    </div>

    <!-- 일괄 처리 패널 -->
    <div id="resolvePanel" class="card bg-base-100 shadow mb-4 hidden">
        <div class="card-body">
            <h3 class="card-title text-base mb-3">
                <i data-lucide="check-circle-2" class="size-5 text-success"></i>
                선택한 신고 처리
            </h3>

            <!-- 보정 범위 라디오 -->
            <div class="form-control mb-3">
                <label class="label">
                    <span class="label-text font-medium">보정 범위</span>
                </label>
                <div class="flex flex-wrap gap-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="correctionScope" value="NONE"
                               class="radio radio-sm" checked/>
                        <span class="text-sm">없음 (NONE)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="correctionScope" value="QUESTION_WIDE"
                               class="radio radio-sm radio-warning"/>
                        <span class="text-sm">문제 전체 (QUESTION_WIDE)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="correctionScope" value="CHOICE_SET_ONLY"
                               class="radio radio-sm radio-info"/>
                        <span class="text-sm">선택지 세트 기준 (CHOICE_SET_ONLY)</span>
                    </label>
                </div>
            </div>

            <!-- 문제 비활성화 체크박스 -->
            <div class="form-control mb-4">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="deactivateQuestion" class="checkbox checkbox-sm checkbox-error"/>
                    <span class="text-sm">문제 비활성화 (isActive = false)</span>
                </label>
            </div>

            <!-- 처리 사유 메모 (선택, 최대 500자) -->
            <div class="form-control mb-4">
                <label class="label" for="resolutionNote">
                    <span class="label-text font-medium">처리 사유 메모 (선택)</span>
                </label>
                <textarea id="resolutionNote" rows="2" maxlength="500"
                          class="textarea textarea-bordered w-full text-sm"
                          placeholder="예: 정답 SQL 수정 후 소급 보정 완료"></textarea>
            </div>

            <!-- 일괄 처리 버튼: 선택한 신고만 서버가 한 트랜잭션으로 처리 -->
            <div class="card-actions items-center">
                <button id="resolveSelectedBtn" class="btn btn-success btn-sm gap-1">
                    <i data-lucide="check-check" class="size-4"></i>
                    선택 처리완료
                </button>
                <button id="dismissSelectedBtn" class="btn btn-ghost btn-sm gap-1">
                    <i data-lucide="x-circle" class="size-4"></i>
                    선택 기각
                </button>
                <span id="resolveResult" class="text-sm ml-2"></span>
            </div>
        </div>
    </div>

    <!-- 신고 목록 -->
    <div class="card bg-base-100 shadow">
        <div class="card-body p-0">
            <div class="flex items-center gap-2 px-4 pt-4 pb-2">
                <h3 class="font-bold text-base">신고 목록</h3>
                <span id="reportCount" class="badge badge-neutral badge-sm"></span>
                <!-- 미처리 신고 전체 선택 (미처리 신고가 있을 때만 JS가 보임) -->
                <label id="selectAllPendingLabel" class="ml-auto hidden items-center gap-2 text-sm cursor-pointer">
                    <input type="checkbox" id="selectAllPending" class="checkbox checkbox-sm" checked/>
                    미처리 전체 선택
                </label>
            </div>
            <div id="reportList" class="divide-y divide-base-200 px-4 pb-4">
                <div class="py-8 text-center text-base-content/50">
                    <span class="loading loading-spinner loading-sm"></span>
                    <span class="ml-2">로딩 중...</span>
                </div>
            </div>
        </div>
    </div>

</th:block>

<th:block layout:fragment="js">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const questionUuid = /*[[${questionUuid}]]*/ null;
        /*]]>*/
    </script>
    <script th:src="@{/js/admin/report-common.js}"></script>
    <script th:src="@{/js/admin/report-detail.js}"></script>
    <script>lucide.createIcons();</script>
</th:block>
</html>
