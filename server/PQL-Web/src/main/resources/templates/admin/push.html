<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">

<th:block layout:fragment="title">알림 발송</th:block>

<th:block layout:fragment="content">

    <!-- 요약 배지 -->
    <div class="flex flex-wrap items-center gap-2 mb-4">
        <div class="badge badge-neutral badge-lg">
            알림함 대상 회원 <span class="ml-1 font-bold" th:text="${inboxRecipientCount}">0</span>
        </div>
        <div class="badge badge-neutral badge-lg">
            수신 동의 기기 <span class="ml-1 font-bold" th:text="${pushEnabledDeviceCount}">0</span>
        </div>
        <div class="badge badge-ghost badge-lg">
            발송 이력 <span class="ml-1 font-bold" th:text="${histories.totalElements}">0</span>
        </div>
    </div>

    <!-- 탭: 발송 / 발송 이력 / 알림 설정 -->
    <div role="tablist" class="tabs tabs-bordered mb-4">
        <button role="tab" class="tab tab-active" id="tab-send" onclick="switchPushTab('send')">
            <i data-lucide="send" class="size-4 mr-1"></i>발송
        </button>
        <button role="tab" class="tab" id="tab-history" onclick="switchPushTab('history')">
            <i data-lucide="history" class="size-4 mr-1"></i>발송 이력
        </button>
        <button role="tab" class="tab" id="tab-settings" onclick="switchPushTab('settings')">
            <i data-lucide="settings" class="size-4 mr-1"></i>알림 설정
        </button>
    </div>

    <div id="panel-send"><th:block th:replace="~{admin/fragments/push-send-form :: send-form}"></th:block></div>
    <div id="panel-history" class="hidden"><th:block th:replace="~{admin/fragments/push-history :: history-table}"></th:block></div>
    <div id="panel-settings" class="hidden"><th:block th:replace="~{admin/fragments/push-history :: notification-settings}"></th:block></div>

    <!-- 서버 값을 JS 로 넘기는 자리 (th:inline 대신 data 속성) -->
    <div id="pushPageData" class="hidden"
         th:data-push-enabled-device-count="${pushEnabledDeviceCount}"
         th:data-inbox-recipient-count="${inboxRecipientCount}"></div>

</th:block>

<th:block layout:fragment="js">
    <script th:src="@{/js/admin/push.js}"></script>
    <script>lucide.createIcons();</script>
</th:block>
</html>
