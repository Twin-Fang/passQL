<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">

<th:block layout:fragment="title">시험 일정 관리</th:block>

<th:block layout:fragment="content">

    <!-- 공식 공고 확인 (#411) — 날짜는 매년 바뀌고 자동으로 가져올 수 없어 사람이 확인해 추가한다 -->
    <div class="card bg-base-100 shadow mb-4">
        <div class="card-body p-4">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <h3 class="card-title text-base">
                    <i data-lucide="megaphone" class="size-5"></i>
                    공식 공고 확인
                </h3>
                <div class="flex flex-wrap items-center gap-2">
                    <a th:href="${officialUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline">
                        <i data-lucide="external-link" class="size-4"></i>
                        데이터자격검정 시험일정
                    </a>
                    <form th:action="@{/admin/exam-schedules/announcement-checked}" method="post">
                        <button type="submit" class="btn btn-sm btn-primary" title="공고를 확인했다고 오늘 날짜를 기록합니다">
                            <i data-lucide="check" class="size-4"></i>
                            공고 확인함
                        </button>
                    </form>
                </div>
            </div>

            <p class="text-xs text-base-content/60 mb-3">
                마지막 공고 확인:
                <b th:if="${checkedAt != null}" th:text="${checkedAt}">2026-10-08</b>
                <b th:if="${checkedAt == null}">기록 없음</b>
                <span th:if="${checkStale}" class="badge badge-warning badge-sm ml-1"
                      th:text="${checkedAt == null} ? '확인 필요' : ${staleDays} + '일 넘게 지남'">확인 필요</span>
            </p>

            <div class="space-y-2">
                <div th:each="c : ${coverages}" class="alert py-2"
                     th:classappend="${c.level.name() == 'ERROR'} ? 'alert-error' : (${c.level.name() == 'WARN'} ? 'alert-warning' : 'alert-success')">
                    <div class="w-full">
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="badge badge-sm badge-neutral" th:text="${c.certType.name()}">SQLD</span>
                            <span class="text-sm font-medium" th:text="${c.message}">메시지</span>
                        </div>
                        <p class="text-xs mt-1 opacity-80" th:if="${c.nextRound != null}">
                            다가오는 시험: 제<span th:text="${c.nextRound}">63</span>회
                            (<span th:text="${c.nextExamDate}">2026-11-14</span>, D-<span th:text="${c.daysUntilNext}">37</span>)
                        </p>
                        <p class="text-xs mt-1 opacity-80" th:if="${c.selectedExpiredRound != null}">
                            선택된 제<span th:text="${c.selectedExpiredRound}">61</span>회는 이미 지났습니다.
                            홈에는 다가오는 시험이 자동으로 표시되지만, 아래 목록에서 새로 선택해 두면 좋습니다.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 회차 추가 폼 -->
    <div class="card bg-base-100 shadow mb-4">
        <div class="card-body p-4">
            <h3 class="card-title text-base mb-3">
                <i data-lucide="plus-circle" class="size-5"></i>
                회차 추가
            </h3>
            <form th:action="@{/admin/exam-schedules}" method="post" class="flex flex-wrap items-end gap-3">
                <div class="form-control">
                    <label class="label"><span class="label-text">자격증</span></label>
                    <select name="certType" class="select select-bordered select-sm" required>
                        <option th:each="ct : ${certTypes}" th:value="${ct.name()}" th:text="${ct.name()}">SQLD</option>
                    </select>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">회차</span></label>
                    <input type="number" name="round" class="input input-bordered input-sm w-24" min="1" required/>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">시험일</span></label>
                    <input type="date" name="examDate" class="input input-bordered input-sm" required/>
                </div>
                <button type="submit" class="btn btn-sm btn-primary">
                    <i data-lucide="plus" class="size-4"></i>
                    추가
                </button>
            </form>
        </div>
    </div>

    <!-- 필터 + 목록 -->
    <div class="card bg-base-100 shadow">
        <div class="card-body p-4">
            <div class="flex items-center justify-between mb-3">
                <h3 class="card-title text-base">
                    <i data-lucide="calendar-days" class="size-5"></i>
                    시험 일정 목록
                </h3>
                <form th:action="@{/admin/exam-schedules}" method="get" class="flex items-center gap-2">
                    <select name="certType" class="select select-bordered select-sm"
                            onchange="this.form.submit()">
                        <option value="">전체</option>
                        <option th:each="ct : ${certTypes}" th:value="${ct.name()}" th:text="${ct.name()}"
                                th:selected="${selectedCertType == ct.name()}">SQLD</option>
                    </select>
                </form>
            </div>

            <div class="overflow-x-auto">
                <table class="table table-sm">
                    <thead>
                    <tr>
                        <th>자격증</th>
                        <th>회차</th>
                        <th>시험일</th>
                        <th class="w-20">선택</th>
                        <th class="w-20">액션</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${schedules}"
                        th:classappend="${s.getIsSelected()} ? 'bg-primary/10'">
                        <td>
                            <span class="badge badge-sm"
                                  th:classappend="${s.certType == 'SQLD'} ? 'badge-info' : 'badge-warning'"
                                  th:text="${s.certType}">SQLD</span>
                        </td>
                        <td th:text="'제' + ${s.round} + '회'">제61회</td>
                        <td th:text="${s.examDate}">2026-05-31</td>
                        <td>
                            <input type="radio" name="selected" class="radio radio-primary radio-sm"
                                   th:checked="${s.getIsSelected()}"
                                   th:data-uuid="${s.examScheduleUuid}"
                                   onclick="selectSchedule(this.dataset.uuid)"/>
                        </td>
                        <td>
                            <button class="btn btn-xs btn-ghost text-error"
                                    th:data-uuid="${s.examScheduleUuid}"
                                    onclick="deleteSchedule(this.dataset.uuid)">
                                <i data-lucide="trash-2" class="size-4"></i>
                            </button>
                        </td>
                    </tr>

                    <tr th:if="${schedules == null or schedules.isEmpty()}">
                        <td colspan="5" class="text-center text-base-content/40 py-8">
                            <i data-lucide="calendar-x" class="size-8 mx-auto mb-2 opacity-30"></i>
                            <p class="text-sm">등록된 시험 일정이 없습니다.</p>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</th:block>

<th:block layout:fragment="js">
    <script>
        lucide.createIcons();

        function selectSchedule(uuid) {
            fetch('/admin/exam-schedules/' + uuid + '/select', { method: 'PUT' })
                .then(res => {
                    if (res.ok) location.reload();
                    else alert('선택 변경에 실패했습니다.');
                });
        }

        function deleteSchedule(uuid) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            fetch('/admin/exam-schedules/' + uuid, { method: 'DELETE' })
                .then(res => {
                    if (res.ok) location.reload();
                    else alert('삭제에 실패했습니다.');
                });
        }
    </script>
</th:block>
</html>
