<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">

<th:block layout:fragment="title">프롬프트 테스트</th:block>

<th:block layout:fragment="content">

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- 좌측: 프롬프트 정보 -->
        <div class="card bg-base-100 shadow">
            <div class="card-body">
                <h2 class="card-title">
                    <i data-lucide="message-square-code" class="size-5"></i>
                    프롬프트 정보
                </h2>

                <div class="flex flex-wrap gap-2 mb-2" th:if="${prompt != null}">
                    <span class="badge badge-primary" th:text="${prompt.keyName}">key</span>
                    <span class="badge badge-outline">v<span th:text="${prompt.version}">1</span></span>
                    <span class="badge badge-ghost" th:text="${prompt.model}">gemini</span>
                </div>

                <div th:if="${prompt != null}">
                    <div class="form-control mb-3">
                        <label class="label label-text font-semibold">System Prompt</label>
                        <pre class="bg-base-200 rounded-lg p-3 text-sm overflow-x-auto whitespace-pre-wrap font-mono"
                             th:text="${prompt.systemPrompt}">-</pre>
                    </div>
                    <div class="form-control">
                        <label class="label label-text font-semibold">User Template</label>
                        <pre class="bg-base-200 rounded-lg p-3 text-sm overflow-x-auto whitespace-pre-wrap font-mono"
                             th:text="${prompt.userTemplate}">-</pre>
                    </div>
                </div>

                <div th:unless="${prompt != null}" class="text-base-content/50 py-8 text-center">
                    프롬프트를 찾을 수 없습니다.
                </div>
            </div>
        </div>

        <!-- 우측: 테스트 패널 -->
        <div class="card bg-base-100 shadow">
            <div class="card-body">
                <h2 class="card-title">
                    <i data-lucide="play" class="size-5"></i>
                    테스트 실행
                </h2>

                <div id="variableInputs" class="flex flex-col gap-3"></div>

                <button class="btn btn-primary mt-4" onclick="runTest()">
                    <i data-lucide="play" class="size-4"></i>
                    테스트 실행
                </button>

                <!-- 결과 -->
                <div id="resultArea" class="hidden mt-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-semibold">결과</span>
                        <span class="badge badge-ghost text-xs">응답시간: <span id="elapsedMs">-</span>ms</span>
                    </div>
                    <pre id="resultText" class="bg-base-200 rounded-lg p-3 text-sm overflow-x-auto whitespace-pre-wrap font-mono min-h-24"></pre>
                </div>

                <div class="divider"></div>

                <!-- 테스트 결과 이력 (최신순, 최대 50건) -->
                <h3 class="font-semibold flex items-center gap-2">
                    <i data-lucide="history" class="size-4"></i>
                    테스트 이력
                </h3>
                <div id="testHistoryList" class="space-y-2 text-sm max-h-96 overflow-y-auto">불러오는 중...</div>

                <div class="divider"></div>

                <button class="btn btn-outline btn-sm" onclick="activateVersion()">
                    <i data-lucide="check-circle" class="size-4"></i>
                    이 버전 활성화
                </button>
            </div>
        </div>

    </div>

</th:block>

<th:block layout:fragment="js">
<script th:inline="javascript">
    const promptUuid = [[${prompt != null ? prompt.promptTemplateUuid : ''}]];
    const userTemplate = [[${prompt != null ? prompt.userTemplate : ''}]];

    const varPattern = /\{(\w+)\}/g;
    const variables = new Set();
    let match;
    while ((match = varPattern.exec(userTemplate)) !== null) {
        variables.add(match[1]);
    }
    const container = document.getElementById('variableInputs');
    variables.forEach(v => {
        container.innerHTML += `
            <div class="form-control">
                <label class="label label-text"><code class="font-mono">{${v}}</code></label>
                <textarea id="var_${v}" class="textarea textarea-bordered font-mono text-sm" rows="2"></textarea>
            </div>
        `;
    });

    async function runTest() {
        const vars = {};
        variables.forEach(v => {
            vars[v] = document.getElementById('var_' + v).value;
        });
        try {
            const data = await AdminApi.post('/admin/prompts/' + promptUuid + '/test', vars);
            document.getElementById('resultText').textContent = data.result;
            document.getElementById('elapsedMs').textContent = data.elapsedMs;
            document.getElementById('resultArea').classList.remove('hidden');
        } catch (error) {
            AdminUi.showError(error, '테스트 실패');
        }
        // 성공·실패 모두 서버가 이력에 저장하므로 다시 불러옴
        loadTestHistory();
    }

    /** 테스트 결과 이력 > 접이식 목록 (입력 변수·응답 원문) */
    async function loadTestHistory() {
        const container = document.getElementById('testHistoryList');
        try {
            const histories = await AdminApi.get('/admin/prompts/' + promptUuid + '/test-history');
            container.innerHTML = histories.map(history => {
                const statusBadge = history.isSuccess
                    ? '<span class="badge badge-success badge-sm">성공</span>'
                    : '<span class="badge badge-error badge-sm">실패</span>';
                const testedAt = history.testedAt ? history.testedAt.substring(0, 16).replace('T', ' ') : '-';
                const body = history.isSuccess ? history.resultText : history.errorMessage;
                return `<details class="border border-base-300 rounded-lg p-2">
                    <summary class="cursor-pointer flex items-center gap-2 flex-wrap">
                        ${statusBadge}
                        <span class="text-xs text-base-content/60">${AdminUi.escapeHtml(history.testedByAdminUsername || '-')} · ${testedAt}${history.elapsedMilliseconds != null ? ' · ' + history.elapsedMilliseconds + 'ms' : ''}</span>
                    </summary>
                    <div class="mt-2 text-xs font-semibold">입력 변수</div>
                    <pre class="bg-base-200 rounded p-2 text-xs font-mono whitespace-pre-wrap break-words">${AdminUi.escapeHtml(history.variablesJson || '-')}</pre>
                    <div class="mt-2 text-xs font-semibold">${history.isSuccess ? '응답' : '실패 사유'}</div>
                    <pre class="bg-base-200 rounded p-2 text-xs font-mono whitespace-pre-wrap break-words">${AdminUi.escapeHtml(body || '-')}</pre>
                </details>`;
            }).join('') || '<p class="text-base-content/50">테스트 이력이 없습니다.</p>';
        } catch (error) {
            container.textContent = '불러오지 못했습니다.';
        }
    }

    async function activateVersion() {
        if (!await AdminUi.confirmDanger('이 버전을 활성화하면 같은 키의 다른 버전은 즉시 비활성화됩니다.', { confirmLabel: '활성화' })) return;
        try {
            await AdminApi.put('/admin/prompts/' + promptUuid + '/activate');
            AdminUi.reloadWithToast('활성화했습니다.');
        } catch (error) {
            AdminUi.showError(error);
        }
    }

    loadTestHistory();
    lucide.createIcons();
</script>
</th:block>
</html>
