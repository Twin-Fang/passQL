<!doctype html>
<!--
  브라우저(HTML) 요청의 오류 화면. Spring 기본 Whitelabel 페이지를 대신한다 (#410).
  API(JSON) 요청은 BasicErrorController가 Accept로 분기해 기존 JSON 응답을 유지한다.
  layout을 쓰지 않는다 — 오류 시점에는 세션·CSRF 모델이 없을 수 있다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'passQL | ' + ${status ?: '오류'}">passQL | 오류</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center px-4">
<div class="card bg-base-100 shadow w-full max-w-sm">
    <div class="card-body items-center text-center gap-3">
        <p class="text-4xl font-bold text-primary" th:text="${status}">404</p>
        <p class="font-semibold"
           th:text="${status == 404} ? '페이지를 찾을 수 없습니다' : (${status == 403} ? '접근 권한이 없습니다' : '요청을 처리하지 못했습니다')">
            페이지를 찾을 수 없습니다</p>
        <p class="text-sm text-base-content/60">주소를 확인하거나 아래 버튼으로 이동해 주세요.</p>
        <!-- 관리자 경로에서 난 오류는 관리자 홈으로 돌려보낸다 -->
        <a th:with="isAdmin=${path != null and #strings.startsWith(path, '/admin')}"
           th:href="${isAdmin} ? @{/admin} : @{/}"
           th:text="${isAdmin} ? '관리자 홈으로' : '홈으로'"
           class="btn btn-primary btn-sm mt-2">홈으로</a>
    </div>
</div>
</body>
</html>
