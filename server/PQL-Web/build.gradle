plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    api project(':PQL-Common')
    api project(':PQL-Domain-Member')
    api project(':PQL-Domain-Question')
    api project(':PQL-Domain-Submission')
    api project(':PQL-Domain-AI')
    api project(':PQL-Domain-Meta')
    api project(':PQL-Application')

    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Firebase Admin SDK (FirebaseConfig가 PQL-Web/config에 위치)
    implementation 'com.google.firebase:firebase-admin:9.11.0'

    // 계층·에러 응답 규칙 테스트 (ArchitectureRuleTest)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

// API 계약 원본(레포 루트 api-contract/openapi.json) 경로·갱신 여부 > OpenApiContractTest (#458)
// 갱신: ./gradlew :PQL-Web:test --tests '*OpenApiContractTest*' -PupdateApiContract
def apiContractFile = rootProject.file('../api-contract/openapi.json')
def shouldUpdateApiContract = project.hasProperty('updateApiContract')
tasks.named('test') {
    systemProperty 'apiContractFile', apiContractFile.absolutePath
    systemProperty 'updateApiContract', shouldUpdateApiContract
    // 계약 파일만 바뀌어도 다시 검사, 갱신 모드는 항상 실행
    inputs.files(apiContractFile).optional().withPropertyName('apiContractFile')
    outputs.upToDateWhen { !shouldUpdateApiContract }
}
