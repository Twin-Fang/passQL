# 의존성 업데이트 자동 PR 설정
# - 월 1회, 생태계별로 마이너·패치를 한 PR로 묶어 PR 폭주를 막는다
# - 메이저 업데이트는 받지 않는다 — Spring Boot 4·TypeScript 7 같은 PR이 매번 빌드 실패로 쌓였다.
#   메이저 전환은 이슈로 계획해 직접 올린다
version: 2
updates:
  # Backend (Spring 멀티모듈)
  - package-ecosystem: "gradle"
    directory: "/server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      server-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend (React + Vite)
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      client-minor-patch:
        update-types: ["minor", "patch"]

  # App (Flutter)
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # pub 묶음에 freezed 4·riverpod 3 같은 major가 섞여 와 pub get이 깨졌다(#420).
      # 코드 생성 계열은 서로 묶여 있어 Flutter SDK 업그레이드·마이그레이션 때 한꺼번에 올린다
      - dependency-name: "freezed"
        versions: [">=3.0.0"]
      - dependency-name: "freezed_annotation"
        versions: [">=3.0.0"]
      - dependency-name: "flutter_riverpod"
        versions: [">=3.0.0"]
      - dependency-name: "riverpod_annotation"
        versions: [">=3.0.0"]
      - dependency-name: "riverpod_generator"
        versions: [">=3.0.0"]
      - dependency-name: "retrofit_generator"
        versions: [">=10.0.0"]
      # freezed 2(source_gen 2·build 2)와 함께 쓸 수 없는 버전
      - dependency-name: "json_annotation"
        versions: [">=4.10.0"]
      - dependency-name: "json_serializable"
        versions: [">=6.11.0"]
      - dependency-name: "build_runner"
        versions: [">=2.16.0"]
    groups:
      app-minor-patch:
        update-types: ["minor", "patch"]

  # AI Server (FastAPI, pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/ai"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      ai-minor-patch:
        update-types: ["minor", "patch"]
