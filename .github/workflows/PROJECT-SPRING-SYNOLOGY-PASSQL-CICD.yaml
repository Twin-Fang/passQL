# ===================================================================
# Spring Boot 전용 CI/CD 배포 워크플로우 - passQL
# ===================================================================

name: PROJECT-SPRING-SYNOLOGY-CICD

on:
  push:
    branches:
      - deploy
    paths:
      - 'server/**'
  workflow_dispatch:
    inputs:
      # 비우면 일반 빌드·배포, 값이 있으면 빌드 생략 > 그 태그로 Blue-Green 배포 (#477)
      rollback_image_tag:
        description: "롤백할 이미지 태그 (예: 0.10.0, sha-1a2b3c4). 비우면 일반 배포"
        required: false
        type: string
        default: ""

env:
  PROJECT_NAME: "passql-back"
  DOCKER_IMAGE_PREFIX: "back-container"
  SPRING_PROFILE: "prod"
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Dspring.profiles.active=prod"
  # jar 포함 금지 파일 (server/PQL-Web/build.gradle bootJar exclude 와 같은 목록)
  SECRET_FILE_PATTERN: "application-prod\\.yml|application-dev\\.yml|firebase-service-account\\.json"
  # 실행용 비밀 설정: {VOLUME_HOST_PATH}/config > 컨테이너 /app/config (읽기 전용)
  # Spring 은 작업 폴더 ./config/application-prod.yml 을 jar 안 설정보다 우선해 읽음
  # 백업 워크플로우(github_secret/)와 별개 경로
  RUNTIME_CONFIG_CONTAINER_PATH: "/app/config"
  # 무중단 배포(Blue-Green): 시놀로지 Traefik(8079)이 Host 라벨로 라우팅한다.
  # DSM 리버스 프록시는 api.passql.suhsaechan.kr → localhost:8079 로 연결한다 (구 8097 직결 대체)
  SERVICE_DOMAIN: "api.passql.suhsaechan.kr"
  CONTAINER_INTERNAL_PORT: "8080"
  TRAEFIK_NETWORK: "traefik-network"
  TRAEFIK_ENTRYPOINT: "web"
  TRAEFIK_INTERNAL_PORT: "8079"
  HEALTHCHECK_PATH: "/actuator/health"
  HEALTHCHECK_MAX_RETRIES: "48"      # 5초 × 48 = 최대 4분 (실측 기동 약 45초)
  HEALTHCHECK_RETRY_INTERVAL: "5"
  # drain 표식 후 구 컨테이너가 unhealthy(5초 간격 × 3회 ≈ 15초)가 돼야 Traefik이 트래픽을 끊는다.
  # 10초면 끊기기 전에 지워져 요청 1건이 실패했다(probe 210회 중 1회) → 여유를 두고 25초
  IN_FLIGHT_WAIT: "25"
  VOLUME_HOST_PATH: "/volume1/projects/passql/backend"
  VOLUME_CONTAINER_PATH: "/mnt"
  # 컨테이너 로그 로테이션 (#476): NAS 기본 db 드라이버는 크기 제한 불가 > json-file 고정
  CONTAINER_LOG_MAX_SIZE: "20m"      # 파일당 최대 크기
  CONTAINER_LOG_MAX_FILE: "5"        # 보관 파일 수 (컨테이너당 최대 100MB)

# 배포가 겹치면 두 실행이 같은 색 슬롯을 지운다 — 한 번에 하나만
concurrency:
  group: passql-back-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Spring Boot 애플리케이션 빌드
    # 롤백 배포는 이미 push된 이미지를 쓰므로 빌드 생략
    if: ${{ inputs.rollback_image_tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      deploy_image_tag: ${{ steps.image_tags.outputs.sha_tag }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle Wrapper 실행권한 부여
        run: chmod +x server/gradlew

      # 비밀 설정은 빌드에 넣지 않음 (공개 이미지) > deploy 잡이 호스트 config/ 에 기록 후 마운트
      - name: Build with Gradle
        working-directory: server
        run: ./gradlew clean build -x test ${{ env.GRADLE_OPTS }}

      # jar 안 비밀 설정 검사 (있으면 push 전 실패)
      - name: 비밀 설정 미포함 확인
        run: |
          if unzip -l server/PQL-Web/build/libs/app.jar | grep -E "BOOT-INF/classes/(${{ env.SECRET_FILE_PATTERN }})$"; then
            echo "❌ jar 에 비밀 설정 포함 — 공개 이미지로 push 하지 않음"; exit 1
          fi
          echo "✅ jar 비밀 설정 없음"

      # 이미지 태그 3개: {브랜치}, {version.yml 버전}, sha-{짧은 sha} — 배포는 sha 태그 기준 (#477)
      - name: 이미지 태그 계산
        id: image_tags
        run: |
          VERSION=$(grep -E '^version:' version.yml | head -1 | sed -E 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
          if [ -z "${VERSION}" ]; then echo "❌ version.yml 버전 읽기 실패"; exit 1; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "🏷️ ${GITHUB_REF_NAME}, ${VERSION}, sha-${GITHUB_SHA::7}"

      - name: Docker 빌드환경 설정
        uses: docker/setup-buildx-action@v3

      - name: DockerHub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('server/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-${{ env.DOCKER_IMAGE_PREFIX }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-${{ env.DOCKER_IMAGE_PREFIX }}:${{ steps.image_tags.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-${{ env.DOCKER_IMAGE_PREFIX }}:${{ steps.image_tags.outputs.sha_tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    name: Blue-Green 무중단 배포
    needs: build
    # 일반 배포: 빌드 성공 시 / 롤백 배포: 빌드 생략(skipped) + 태그 입력 시
    if: ${{ !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.rollback_image_tag != '')) }}
    runs-on: ubuntu-latest
    steps:
      # 배포 태그: 롤백 입력 우선, 없으면 이번 빌드 sha 태그 (docker 태그 문법 외 값은 원격 스크립트에 넣지 않음)
      - name: 배포 이미지 태그 결정
        id: deploy_tag
        env:
          ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
          BUILT_IMAGE_TAG: ${{ needs.build.outputs.deploy_image_tag }}
        run: |
          TAG="${ROLLBACK_IMAGE_TAG:-$BUILT_IMAGE_TAG}"
          if ! printf '%s' "${TAG}" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "❌ 잘못된 이미지 태그: '${TAG}'"; exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "${ROLLBACK_IMAGE_TAG}" ]; then echo "⏪ 롤백 배포: ${TAG}"; else echo "🚀 일반 배포: ${TAG}"; fi

      # Secret 원문 > base64 한 줄 (줄바꿈·따옴표 손상 없이 ssh 전달, 로그 마스킹)
      - name: 실행용 비밀 설정 인코딩
        env:
          APPLICATION_PROD_YML: ${{ secrets.APPLICATION_PROD_YML }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          for NAME in APPLICATION_PROD_YML FIREBASE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!NAME}" ]; then echo "❌ Secret ${NAME} 미설정"; exit 1; fi
            ENCODED=$(printf '%s' "${!NAME}" | base64 -w0)
            echo "::add-mask::${ENCODED}"
            echo "${NAME}_BASE64=${ENCODED}" >> "$GITHUB_ENV"
          done

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-${{ env.DOCKER_IMAGE_PREFIX }}:${{ steps.deploy_tag.outputs.tag }}
          SERVICE_DOMAIN: ${{ env.SERVICE_DOMAIN }}
          SPRING_PROFILE: ${{ env.SPRING_PROFILE }}
          CONTAINER_INTERNAL_PORT: ${{ env.CONTAINER_INTERNAL_PORT }}
          TRAEFIK_NETWORK: ${{ env.TRAEFIK_NETWORK }}
          TRAEFIK_ENTRYPOINT: ${{ env.TRAEFIK_ENTRYPOINT }}
          TRAEFIK_INTERNAL_PORT: ${{ env.TRAEFIK_INTERNAL_PORT }}
          HEALTHCHECK_PATH: ${{ env.HEALTHCHECK_PATH }}
          HEALTHCHECK_MAX_RETRIES: ${{ env.HEALTHCHECK_MAX_RETRIES }}
          HEALTHCHECK_RETRY_INTERVAL: ${{ env.HEALTHCHECK_RETRY_INTERVAL }}
          IN_FLIGHT_WAIT: ${{ env.IN_FLIGHT_WAIT }}
          VOLUME_HOST_PATH: ${{ env.VOLUME_HOST_PATH }}
          VOLUME_CONTAINER_PATH: ${{ env.VOLUME_CONTAINER_PATH }}
          CONTAINER_LOG_MAX_SIZE: ${{ env.CONTAINER_LOG_MAX_SIZE }}
          CONTAINER_LOG_MAX_FILE: ${{ env.CONTAINER_LOG_MAX_FILE }}
          RUNTIME_CONFIG_CONTAINER_PATH: ${{ env.RUNTIME_CONFIG_CONTAINER_PATH }}
          APPLICATION_PROD_YML_BASE64: ${{ env.APPLICATION_PROD_YML_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 2022
          command_timeout: 600s
          timeout: 60s
          envs: PROJECT_NAME,IMAGE,SERVICE_DOMAIN,SPRING_PROFILE,CONTAINER_INTERNAL_PORT,TRAEFIK_NETWORK,TRAEFIK_ENTRYPOINT,TRAEFIK_INTERNAL_PORT,HEALTHCHECK_PATH,HEALTHCHECK_MAX_RETRIES,HEALTHCHECK_RETRY_INTERVAL,IN_FLIGHT_WAIT,VOLUME_HOST_PATH,VOLUME_CONTAINER_PATH,CONTAINER_LOG_MAX_SIZE,CONTAINER_LOG_MAX_FILE,RUNTIME_CONFIG_CONTAINER_PATH,APPLICATION_PROD_YML_BASE64,FIREBASE_SERVICE_ACCOUNT_JSON_BASE64,SERVER_PASSWORD
          # projectops PROJECT-SPRING-NONSTOP-TRAEFIK-CICD 흐름을 passQL 모노레포·볼륨에 맞춘 것.
          # 새 색 컨테이너를 띄워 Traefik 경유 헬스체크가 통과한 뒤에만 구 색을 내린다 — 실패하면 구 색이 계속 서비스한다.
          script: |
            set -e
            export PATH=$PATH:/usr/local/bin
            SUDO() { echo "$SERVER_PASSWORD" | sudo -S "$@"; }
            ROUTER="${PROJECT_NAME}"
            # 실행 중 로그는 docker 로테이션(max-size·max-file)이 상한 관리, 컨테이너 삭제 시 남은 로그는 볼륨에 압축 보관 (#436, #476)
            # 보관본: {VOLUME_HOST_PATH}/logs/{컨테이너}-{yyyyMMdd-HHmmss}.log.gz, 30일 지난 것 정리
            LOG_DIR="${VOLUME_HOST_PATH}/logs"
            archive_logs() {
              SUDO mkdir -p "${LOG_DIR}"
              F="${LOG_DIR}/$1-$(date +%Y%m%d-%H%M%S).log.gz"
              SUDO sh -c "docker logs --timestamps '$1' 2>&1 | gzip > '${F}'" && echo "🗄️ $1 로그 보관: ${F}" || echo "⚠️ $1 로그 보관 실패 (배포는 계속)"
              SUDO find "${LOG_DIR}" -name '*.log.gz' -mtime +30 -delete 2>/dev/null || true
            }

            echo "📥 이미지 Pull: ${IMAGE}"
            SUDO docker pull "${IMAGE}"

            # 현재 서비스 중인 색 판별 (구 단일 컨테이너 passql-back 은 이름이 달라 잡히지 않는다)
            ACTIVE=$(SUDO docker ps --filter "name=^${PROJECT_NAME}-(blue|green)$" --format '{{.Names}}' | head -1 || true)
            if [ "$ACTIVE" = "${PROJECT_NAME}-blue" ]; then NEW=green; OLD=blue; else NEW=blue; OLD=green; fi
            NEW_NAME="${PROJECT_NAME}-${NEW}"; OLD_NAME="${PROJECT_NAME}-${OLD}"
            echo "🎨 active=${ACTIVE:-none} → new=${NEW_NAME}"

            SUDO docker rm -f "${NEW_NAME}" 2>/dev/null || true
            SUDO mkdir -p "${VOLUME_HOST_PATH}"

            # 실행용 비밀 설정 기록: {VOLUME_HOST_PATH}/config/{파일} (root 전용 600, .new 작성 후 교체)
            # 구 색은 기동 시 이미 읽어 영향 없음, 롤백(옛 이미지)도 이 설정이 jar 안 설정보다 우선
            CONFIG_HOST_DIR="${VOLUME_HOST_PATH}/config"
            SUDO mkdir -p "${CONFIG_HOST_DIR}"
            SUDO chmod 700 "${CONFIG_HOST_DIR}"
            write_runtime_config() {
              TMP_FILE=$(mktemp)
              printf '%s' "$2" | base64 -d > "${TMP_FILE}"
              if [ ! -s "${TMP_FILE}" ]; then rm -f "${TMP_FILE}"; echo "❌ $1 내용 없음"; exit 1; fi
              SUDO cp "${TMP_FILE}" "${CONFIG_HOST_DIR}/$1.new"
              rm -f "${TMP_FILE}"
              SUDO chmod 600 "${CONFIG_HOST_DIR}/$1.new"
              SUDO mv -f "${CONFIG_HOST_DIR}/$1.new" "${CONFIG_HOST_DIR}/$1"
              echo "🔐 $1 기록"
            }
            write_runtime_config application-prod.yml "${APPLICATION_PROD_YML_BASE64}"
            write_runtime_config firebase-service-account.json "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64}"

            # HTTP(80) 요청은 DSM 80 항목이 X-Forwarded-Proto: http 를 달아 8079로 보낸다 (#389).
            # X-Forwarded-Proto 가 http 일 때만 https로 영구 리다이렉트 — 443 경로(https)는 기존 라우터로 간다
            # drain 표식이 있으면 unhealthy → Traefik이 새 요청을 보내지 않는다
            HEALTH_URL="http://127.0.0.1:${CONTAINER_INTERNAL_PORT}${HEALTHCHECK_PATH}"
            HEALTH_CMD="[ -f /tmp/.pops-drain ] && exit 1; wget -q -O /dev/null ${HEALTH_URL}"

            echo "🐳 새 컨테이너 기동: ${NEW_NAME}"
            SUDO docker run -d \
              --name "${NEW_NAME}" \
              --restart unless-stopped \
              --log-driver json-file \
              --log-opt "max-size=${CONTAINER_LOG_MAX_SIZE}" \
              --log-opt "max-file=${CONTAINER_LOG_MAX_FILE}" \
              --health-cmd "${HEALTH_CMD}" \
              --health-interval 5s \
              --health-timeout 3s \
              --health-retries 3 \
              --health-start-period 120s \
              --network "${TRAEFIK_NETWORK}" \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.${ROUTER}.rule=Host(\`${SERVICE_DOMAIN}\`)" \
              --label "traefik.http.routers.${ROUTER}.entrypoints=${TRAEFIK_ENTRYPOINT}" \
              --label "traefik.http.services.${ROUTER}.loadbalancer.server.port=${CONTAINER_INTERNAL_PORT}" \
              --label "traefik.http.routers.${ROUTER}-http.rule=Host(\`${SERVICE_DOMAIN}\`) && Header(\`X-Forwarded-Proto\`, \`http\`)" \
              --label "traefik.http.routers.${ROUTER}-http.entrypoints=${TRAEFIK_ENTRYPOINT}" \
              --label "traefik.http.routers.${ROUTER}-http.priority=1000" \
              --label "traefik.http.routers.${ROUTER}-http.middlewares=${ROUTER}-https" \
              --label "traefik.http.routers.${ROUTER}-http.service=${ROUTER}" \
              --label "traefik.http.middlewares.${ROUTER}-https.redirectscheme.scheme=https" \
              --label "traefik.http.middlewares.${ROUTER}-https.redirectscheme.permanent=true" \
              -e TZ=Asia/Seoul \
              -e "SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}" \
              -e "FIREBASE_KEYPATH=${RUNTIME_CONFIG_CONTAINER_PATH}/firebase-service-account.json" \
              -v /etc/localtime:/etc/localtime:ro \
              -v "${VOLUME_HOST_PATH}:${VOLUME_CONTAINER_PATH}" \
              -v "${CONFIG_HOST_DIR}:${RUNTIME_CONFIG_CONTAINER_PATH}:ro" \
              "${IMAGE}"

            # 컨테이너 자체 헬스(healthy)와 Traefik 경유 응답(200)이 모두 확인돼야 전환으로 본다
            OK=false
            for i in $(seq 1 ${HEALTHCHECK_MAX_RETRIES}); do
              sleep ${HEALTHCHECK_RETRY_INTERVAL}
              STATE=$(SUDO docker inspect --format '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{end}}' "${NEW_NAME}" 2>/dev/null || echo "missing/")
              if [ "${STATE%%/*}" = "exited" ]; then
                echo "❌ ${NEW_NAME} 종료됨 — 로그:"; SUDO docker logs --tail 200 "${NEW_NAME}"; exit 1
              fi
              # Traefik은 헤더 없는 평문 요청에 X-Forwarded-Proto: http 를 스스로 붙여 리다이렉트 라우터에 걸린다(301).
              # 실제 HTTPS 트래픽(DSM 443 항목)과 같은 헤더로 확인한다
              CODE=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -H "Host: ${SERVICE_DOMAIN}" -H "X-Forwarded-Proto: https" "http://localhost:${TRAEFIK_INTERNAL_PORT}${HEALTHCHECK_PATH}" || echo 000)
              if [ "${STATE#*/}" = "healthy" ] && [ "$CODE" = "200" ]; then
                echo "✅ 헬스체크 통과 (${i}회) state=${STATE} http=${CODE}"; OK=true; break
              fi
              echo "⏳ ${i}/${HEALTHCHECK_MAX_RETRIES} state=${STATE} http=${CODE}"
            done
            if [ "$OK" != "true" ]; then
              echo "❌ 헬스체크 타임아웃 — ${NEW_NAME} 로그 (구 색은 그대로 서비스 중):"
              SUDO docker logs --tail 200 "${NEW_NAME}"; exit 1
            fi

            # 구 색 정리: drain 표식 → in-flight 대기 → 제거
            if SUDO docker ps -a --format '{{.Names}}' | grep -qx "${OLD_NAME}"; then
              SUDO docker exec "${OLD_NAME}" touch /tmp/.pops-drain >/dev/null 2>&1 || true
              echo "⏱️ in-flight 대기 ${IN_FLIGHT_WAIT}초"; sleep ${IN_FLIGHT_WAIT}
              archive_logs "${OLD_NAME}"
              SUDO docker rm -f "${OLD_NAME}"
              echo "🗑️ ${OLD_NAME} 제거"
            fi

            # 구 단일 컨테이너(8097 직결)는 DSM 프록시를 8079로 옮긴 뒤 수동으로 지운다 — 자동 삭제하면 전환 전 장애가 난다
            if SUDO docker ps -a --format '{{.Names}}' | grep -qx "${PROJECT_NAME}"; then
              echo "⚠️ 구 컨테이너 ${PROJECT_NAME}(8097) 남아 있음 — DSM 프록시 전환 확인 후 수동 삭제"
            fi
            echo "✅ 무중단 배포 완료: active=${NEW_NAME} (https://${SERVICE_DOMAIN})"
