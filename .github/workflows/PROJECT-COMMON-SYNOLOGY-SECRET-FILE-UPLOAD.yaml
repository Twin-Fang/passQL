# ===================================================================
# PROJECT-COMMON-SYNOLOGY-SECRET-FILE-UPLOAD.yaml
# GitHub Secret 파일 Synology NAS 자동 업로드
# ===================================================================
#
# GitHub Secrets에 저장된 설정 파일들을 Synology NAS에
# 자동 업로드하여 변경 이력을 추적합니다.
# 타임스탬프 기반 백업으로 변경 히스토리를 보존합니다.
#
# ===================================================================
# 🤖 AI 에이전트 커스텀 가이드
# ===================================================================
# 이 워크플로우를 프로젝트에 맞게 수정하려면,
# 아래 프롬프트를 AI 에이전트에게 전달하세요:
#
# 📋 프롬프트:
# "PROJECT-COMMON-SYNOLOGY-SECRET-FILE-UPLOAD.yaml을
#  프로젝트에 맞게 수정해줘.
#  - 프로젝트명: {프로젝트명}
#  - 역할(ROLE): {backend/frontend 등}
#  - Synology 경로: {NAS 저장 경로}
#  - SSH 포트: {포트번호}
#  - 업로드할 GitHub Secrets:
#    SECRET_KEY → 저장할_파일명.확장자
#  기존 파일 목록 섹션에 추가하고,
#  없는 Secret은 스킵하도록 해줘."
#
# 💡 예시:
# "- APPLICATION_PROD_YML → application-prod.yml
#  - FIREBASE_KEY_JSON → firebase-admin-sdk.json
#  - VERTEX_SA_KEY → vertex-sa-key.json
#  - ADMIN_YML → admin.yml"
# ===================================================================
#
# ===================================================================
# 💡 시크릿을 바꾼 뒤에는 이 워크플로우를 workflow_dispatch 로 수동 실행해 NAS 백업을 갱신하세요 (시크릿 변경은 push 가 아니라 자동 실행되지 않음)
#
# 🔑 필수 GitHub Secrets
# ===================================================================
# SERVER_HOST: Synology NAS 주소
# SERVER_USER: SSH 사용자명
# SERVER_PASSWORD: SSH 비밀번호
# ===================================================================
#
# 🔧 환경변수 설정 (env 섹션에서 설정)
# ===================================================================
#
# 📦 프로젝트 설정:
# PROJECT_NAME: 프로젝트명 (NAS 경로에 사용)
# 역할(backend·app): 파일 업로드 섹션의 save_secret 두 번째 인자로 지정
# SYNOLOGY_BASE_PATH: NAS 기본 경로 (기본: /volume1/projects)
#
# 🔌 SSH 연결:
# SSH_PORT: SSH 포트 (기본: 2022)
# ===================================================================

name: PROJECT-COMMON-SYNOLOGY-SECRET-FILE-UPLOAD

# ===================================================================
# 트리거 설정
# ===================================================================
# main 브랜치에 push할 때 자동 실행됩니다.
# workflow_dispatch로 수동 실행도 가능합니다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: synology-secret-file-upload-${{ github.ref }}
  cancel-in-progress: true

# ===================================================================
# 환경 변수 설정
# ===================================================================
env:
  # 🔧 프로젝트 설정 - 프로젝트에 맞게 수정하세요
  PROJECT_NAME: "passql"
  SYNOLOGY_BASE_PATH: "/volume1/projects"
  SSH_PORT: "2022"

jobs:
  upload-secret-files:
    name: Secret 파일 업로드
    runs-on: ubuntu-latest
    # [skip ci] 커밋 메시지가 포함된 경우 실행하지 않음
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: 타임스탬프 및 커밋 정보 생성
        run: |
          export TZ='Asia/Seoul'
          TIMESTAMP=$(date '+%Y-%m-%d_%H-%M-%S')
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date '+%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "SHORT_COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_ENV
          echo "생성된 타임스탬프: $TIMESTAMP"

      - name: Secret 파일 업로드
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -e

            # GitHub Actions 환경변수 직접 설정
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            SYNOLOGY_BASE_PATH="${{ env.SYNOLOGY_BASE_PATH }}"
            TIMESTAMP="${{ env.TIMESTAMP }}"
            SHORT_COMMIT_HASH="${{ env.SHORT_COMMIT_HASH }}"
            BUILD_DATE="${{ env.BUILD_DATE }}"

            # 역할(backend·app)별 폴더는 save_secret 이 만든다
            ROOT_DIR="${SYNOLOGY_BASE_PATH}/${PROJECT_NAME}/github_secret"
            TMP_SECRET="/tmp/_suh_secret_$$"
            SAVED_LIST="/tmp/_suh_saved_$$"
            : > "$SAVED_LIST"

            echo "=== Secret 파일 업로드 시작 ==="
            echo "프로젝트: ${PROJECT_NAME}"
            echo "경로: ${ROOT_DIR}"
            echo "타임스탬프: ${TIMESTAMP}"

            # sudo 인증을 한 번 받아 두면 이후 sudo 호출은 캐시를 쓴다
            export PW="${{ secrets.SERVER_PASSWORD }}"
            echo "$PW" | sudo -S mkdir -p "${ROOT_DIR}"

            # $TMP_SECRET 에 담긴 Secret 을 {역할}/{파일} 과 {역할}/{타임스탬프}/{파일} 두 곳에 저장한다.
            # 사용법: save_secret SECRET_NAME 역할 파일명 [b64]
            #   b64: Secret 이 base64 로 들어 있어 원본 바이너리(키스토어·인증서 등)로 풀어 저장
            # Secret 이 비어 있으면 건너뛴다 (레포에 없는 Secret 이 있어도 워크플로가 실패하지 않게)
            save_secret() {
              name="$1"; role="$2"; file="$3"; mode="$4"
              if [ ! -s "$TMP_SECRET" ] || [ -z "$(tr -d '[:space:]' < "$TMP_SECRET")" ]; then
                echo "${name} 스킵 (Secret 미설정)"
                rm -f "$TMP_SECRET"
                return 0
              fi
              dir="${ROOT_DIR}/${role}"
              sudo mkdir -p "${dir}/${TIMESTAMP}"
              if [ "$mode" = "b64" ]; then
                # 줄바꿈·공백이 섞여 들어와도 디코딩되도록 정리한 뒤 푼다
                tr -d '[:space:]' < "$TMP_SECRET" | base64 -d > "${TMP_SECRET}.bin"
                mv "${TMP_SECRET}.bin" "$TMP_SECRET"
              fi
              sudo cp "$TMP_SECRET" "${dir}/${file}"
              sudo cp "$TMP_SECRET" "${dir}/${TIMESTAMP}/${file}"
              sudo chmod 600 "${dir}/${file}" "${dir}/${TIMESTAMP}/${file}"
              rm -f "$TMP_SECRET"
              echo "${name} → ${role}/${file} 업로드 완료"
              echo "${role}|${name}|${file}" >> "$SAVED_LIST"
            }

            # ============================================
            # 📦 파일 업로드 섹션
            # Secret 을 heredoc 으로 임시 파일에 쓰고 save_secret 으로 저장한다.
            # 새 Secret 은 같은 3줄 블록을 복사해 이름·역할·파일명만 바꾼다.
            # ============================================

            # ---------- backend (Spring·AI 서버) ----------
            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.APPLICATION_PROD_YML }}
            __SUH_SECRET_EOF__
            save_secret APPLICATION_PROD_YML backend application-prod.yml

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
            __SUH_SECRET_EOF__
            save_secret FIREBASE_SERVICE_ACCOUNT_JSON backend firebase-service-account.json

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.AI_ENV_FILE }}
            __SUH_SECRET_EOF__
            save_secret AI_ENV_FILE ai .env

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.ENV_FILE }}
            __SUH_SECRET_EOF__
            save_secret ENV_FILE app .env

            # SQLD 조사 자료 암호화 키 (docs/sqld-research-encrypted 복호화용, #511)
            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.RESEARCH_DOCS_ENCRYPTION_KEY }}
            __SUH_SECRET_EOF__
            save_secret RESEARCH_DOCS_ENCRYPTION_KEY backend research-docs-encryption-key.txt

            # ---------- app (Flutter 스토어 배포·서명 키) ----------
            # Apple .p8 처럼 다시 내려받을 수 없는 키가 있어 서버 백업이 유일한 사본이 될 수 있다
            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.APPLE_SIWA_KEY_P8 }}
            __SUH_SECRET_EOF__
            save_secret APPLE_SIWA_KEY_P8 app AuthKey_SIWA.p8

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
            __SUH_SECRET_EOF__
            save_secret APP_STORE_CONNECT_API_KEY_BASE64 app AuthKey_AppStoreConnect.p8 b64

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
            __SUH_SECRET_EOF__
            save_secret APPLE_CERTIFICATE_BASE64 app apple-distribution.p12 b64

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
            __SUH_SECRET_EOF__
            save_secret APPLE_PROVISIONING_PROFILE_BASE64 app appstore.mobileprovision b64

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.APPLE_APNS_CERT_P12_BASE64 }}
            __SUH_SECRET_EOF__
            save_secret APPLE_APNS_CERT_P12_BASE64 app apple-apns-cert.p12 b64

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.APPLE_APNS_CERT_PASSWORD }}
            __SUH_SECRET_EOF__
            save_secret APPLE_APNS_CERT_PASSWORD app apple-apns-cert-password.txt

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
            __SUH_SECRET_EOF__
            save_secret GOOGLE_SERVICE_INFO_PLIST_BASE64 app GoogleService-Info.plist b64

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.GOOGLE_SERVICES_JSON }}
            __SUH_SECRET_EOF__
            save_secret GOOGLE_SERVICES_JSON app google-services.json

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
            __SUH_SECRET_EOF__
            save_secret RELEASE_KEYSTORE_BASE64 app release-keystore.jks b64

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
            __SUH_SECRET_EOF__
            save_secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 app google-play-service-account.json b64

            cat << '__SUH_SECRET_EOF__' > "$TMP_SECRET"
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
            __SUH_SECRET_EOF__
            save_secret FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 app firebase-app-distribution-service-account.json b64

            # ============================================
            # 📋 메타데이터 JSON 생성 — 실제로 저장된 파일만 역할별로 기록
            # ============================================
            # 값형 시크릿(비밀번호·ID·토큰)을 역할별 .env 한 파일로 묶어 저장 (비어 있는 키는 쓰지 않음, 모두 비면 스킵)
            # 값은 따옴표 처리한 heredoc 으로 읽어 값 안의 특수문자가 스크립트를 깨지 않게 함
            append_value() {
              value=$(cat)
              if [ -n "$value" ]; then printf '%s=%s\n' "$1" "$value" >> "$TMP_SECRET"; fi
            }

            # app/store-signing-values.env: iOS·Android 서명, App Store Connect (인증서·키 파일의 비밀번호와 식별자)
            : > "$TMP_SECRET"
            append_value APPLE_CERTIFICATE_PASSWORD << '__SUH_SECRET_EOF__'
            ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
            __SUH_SECRET_EOF__
            append_value APP_STORE_CONNECT_API_KEY_ID << '__SUH_SECRET_EOF__'
            ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
            __SUH_SECRET_EOF__
            append_value APP_STORE_CONNECT_ISSUER_ID << '__SUH_SECRET_EOF__'
            ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
            __SUH_SECRET_EOF__
            append_value IOS_BUNDLE_ID << '__SUH_SECRET_EOF__'
            ${{ secrets.IOS_BUNDLE_ID }}
            __SUH_SECRET_EOF__
            append_value IOS_PROVISIONING_PROFILE_NAME << '__SUH_SECRET_EOF__'
            ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
            __SUH_SECRET_EOF__
            append_value RELEASE_KEYSTORE_PASSWORD << '__SUH_SECRET_EOF__'
            ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
            __SUH_SECRET_EOF__
            append_value RELEASE_KEY_ALIAS << '__SUH_SECRET_EOF__'
            ${{ secrets.RELEASE_KEY_ALIAS }}
            __SUH_SECRET_EOF__
            append_value RELEASE_KEY_PASSWORD << '__SUH_SECRET_EOF__'
            ${{ secrets.RELEASE_KEY_PASSWORD }}
            __SUH_SECRET_EOF__
            save_secret STORE_SIGNING_VALUES app store-signing-values.env

            # backend/dockerhub.env: 서버 이미지 푸시 계정
            : > "$TMP_SECRET"
            append_value DOCKERHUB_USERNAME << '__SUH_SECRET_EOF__'
            ${{ secrets.DOCKERHUB_USERNAME }}
            __SUH_SECRET_EOF__
            append_value DOCKERHUB_TOKEN << '__SUH_SECRET_EOF__'
            ${{ secrets.DOCKERHUB_TOKEN }}
            __SUH_SECRET_EOF__
            save_secret DOCKERHUB_VALUES backend dockerhub.env

            # web/vercel.env: 웹 배포 식별자와 토큰
            : > "$TMP_SECRET"
            append_value VERCEL_ORG_ID << '__SUH_SECRET_EOF__'
            ${{ secrets.VERCEL_ORG_ID }}
            __SUH_SECRET_EOF__
            append_value VERCEL_PROJECT_ID << '__SUH_SECRET_EOF__'
            ${{ secrets.VERCEL_PROJECT_ID }}
            __SUH_SECRET_EOF__
            append_value VERCEL_TOKEN << '__SUH_SECRET_EOF__'
            ${{ secrets.VERCEL_TOKEN }}
            __SUH_SECRET_EOF__
            save_secret VERCEL_VALUES web vercel.env

            for role in $(cut -d'|' -f1 "$SAVED_LIST" | sort -u); do
              files=$(grep "^${role}|" "$SAVED_LIST" | awk -F'|' -v d="$BUILD_DATE" \
                '{printf "%s    {\"secret_name\": \"%s\", \"file_name\": \"%s\", \"last_updated\": \"%s\"}", (NR>1?",\n":""), $2, $3, d}')
              cat << EOF | sudo tee "${ROOT_DIR}/${role}/${TIMESTAMP}/cicd-gitignore-file.json" > /dev/null
            {
              "build_info": {
                "timestamp": "$TIMESTAMP",
                "workflow": "Secret 파일 자동 업로드",
                "run_id": "${{ github.run_id }}",
                "run_number": "${{ github.run_number }}",
                "event": "${{ github.event_name }}",
                "repository": "${{ github.repository }}",
                "branch": "${{ github.ref_name }}",
                "commit_hash": "${{ github.sha }}",
                "short_hash": "$SHORT_COMMIT_HASH",
                "commit_url": "https://github.com/${{ github.repository }}/commit/${{ github.sha }}",
                "actor": "${{ github.actor }}",
                "build_date": "$BUILD_DATE"
              },
              "files": [
            $files
              ]
            }
            EOF
              # 타임스탬프 인덱스 업데이트
              echo "{\"last_updated\": \"${TIMESTAMP}\", \"commit\": \"${SHORT_COMMIT_HASH}\", \"actor\": \"${{ github.actor }}\", \"status\": \"completed\"}" | sudo tee "${ROOT_DIR}/${role}/timestamp_index.json" > /dev/null
            done

            echo "저장된 파일 $(wc -l < "$SAVED_LIST" | tr -d ' ')개"
            rm -f "$SAVED_LIST"
            echo "=== 모든 파일 업로드 완료 ==="
