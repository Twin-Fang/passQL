# ===================================================================
# passQL AI Server CI/CD 배포 워크플로우
# ===================================================================
#
# 📋 필수 GitHub Secrets 설정 가이드
# (Settings > Secrets and variables > Actions)
#
# ┌─────────────────────────────┬────────────────────────────────────┐
# │ Secret 이름                 │ 설명                               │
# ├─────────────────────────────┼────────────────────────────────────┤
# │ DOCKERHUB_USERNAME          │ DockerHub 사용자명                 │
# │ DOCKERHUB_TOKEN             │ DockerHub 액세스 토큰              │
# │ SERVER_HOST                 │ 시놀로지 NAS IP/도메인             │
# │ SERVER_USER                 │ SSH 접속 사용자명                  │
# │ SERVER_PASSWORD             │ SSH 접속 비밀번호                  │
# │ AI_ENV_FILE                 │ ai/.env 파일 전체 내용             │
# └─────────────────────────────┴────────────────────────────────────┘
#
# ===================================================================

name: PROJECT-PYTHON-AI-CICD

on:
  push:
    branches:
      - deploy
    paths:
      - 'ai/**'
  workflow_dispatch:

env:
  PROJECT_NAME: "passql-ai"
  PYTHON_VERSION: "3.13"
  # 무중단 배포(Blue-Green, #564): 백엔드(PROJECT-SPRING-SYNOLOGY-PASSQL-CICD)와 같은 방식
  # 시놀로지 Traefik(8079)이 Host 라벨로 라우팅, DSM 리버스 프록시는 ai.passql.suhsaechan.kr(443) → localhost:8079
  SERVICE_DOMAIN: "ai.passql.suhsaechan.kr"
  CONTAINER_INTERNAL_PORT: "8093"
  TRAEFIK_NETWORK: "traefik-network"
  TRAEFIK_ENTRYPOINT: "web"
  TRAEFIK_INTERNAL_PORT: "8079"
  HEALTHCHECK_PATH: "/health"
  HEALTHCHECK_MAX_RETRIES: "36"      # 5초 × 36 = 최대 3분
  HEALTHCHECK_RETRY_INTERVAL: "5"
  # drain 후 구 컨테이너 유지 시간: unhealthy 판정(약 15초) + AI 호출 최대 길이(해설 생성 약 50초) 여유
  IN_FLIGHT_WAIT: "75"
  VOLUME_HOST_PATH: "/volume1/projects/passql/ai"
  VOLUME_CONTAINER_PATH: "/mnt/passql-ai"
  # 컨테이너 로그 로테이션: NAS 기본 db 드라이버는 크기 제한 불가 > json-file 고정
  CONTAINER_LOG_MAX_SIZE: "20m"      # 파일당 최대 크기
  CONTAINER_LOG_MAX_FILE: "5"        # 보관 파일 수

# 배포가 겹치면 두 실행이 같은 색 슬롯을 지운다 — 한 번에 하나만
concurrency:
  group: passql-ai-deploy
  cancel-in-progress: false

jobs:
  # ===================================================================
  # 빌드 작업
  # ===================================================================
  build:
    name: passQL AI 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 디스크 공간 확보
        run: |
          echo "📊 빌드 전 디스크 사용량:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af --volumes || true
          echo "📊 정리 후 디스크 사용량:"
          df -h

      - name: .env.prod 파일 생성
        run: |
          cat > ai/.env.prod <<EOF
          ${{ secrets.AI_ENV_FILE }}
          EOF
          echo "✅ .env.prod 파일이 생성되었습니다"

      - name: Docker 빌드환경 설정
        uses: docker/setup-buildx-action@v3

      - name: DockerHub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          file: ./ai/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 빌드 후 정리
        if: always()
        run: |
          docker system prune -f || true
          echo "📊 최종 디스크 사용량:"
          df -h

  # ===================================================================
  # 배포 작업
  # ===================================================================
  deploy:
    name: 원격 서버 배포
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:${{ github.ref_name }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          SERVICE_DOMAIN: ${{ env.SERVICE_DOMAIN }}
          CONTAINER_INTERNAL_PORT: ${{ env.CONTAINER_INTERNAL_PORT }}
          TRAEFIK_NETWORK: ${{ env.TRAEFIK_NETWORK }}
          TRAEFIK_ENTRYPOINT: ${{ env.TRAEFIK_ENTRYPOINT }}
          TRAEFIK_INTERNAL_PORT: ${{ env.TRAEFIK_INTERNAL_PORT }}
          HEALTHCHECK_PATH: ${{ env.HEALTHCHECK_PATH }}
          HEALTHCHECK_MAX_RETRIES: ${{ env.HEALTHCHECK_MAX_RETRIES }}
          HEALTHCHECK_RETRY_INTERVAL: ${{ env.HEALTHCHECK_RETRY_INTERVAL }}
          IN_FLIGHT_WAIT: ${{ env.IN_FLIGHT_WAIT }}
          VOLUME_HOST_PATH: ${{ env.VOLUME_HOST_PATH }}
          VOLUME_CONTAINER_PATH: ${{ env.VOLUME_CONTAINER_PATH }}
          CONTAINER_LOG_MAX_SIZE: ${{ env.CONTAINER_LOG_MAX_SIZE }}
          CONTAINER_LOG_MAX_FILE: ${{ env.CONTAINER_LOG_MAX_FILE }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 2022
          command_timeout: 600s
          timeout: 60s
          envs: PROJECT_NAME,IMAGE,SERVICE_DOMAIN,CONTAINER_INTERNAL_PORT,TRAEFIK_NETWORK,TRAEFIK_ENTRYPOINT,TRAEFIK_INTERNAL_PORT,HEALTHCHECK_PATH,HEALTHCHECK_MAX_RETRIES,HEALTHCHECK_RETRY_INTERVAL,IN_FLIGHT_WAIT,VOLUME_HOST_PATH,VOLUME_CONTAINER_PATH,CONTAINER_LOG_MAX_SIZE,CONTAINER_LOG_MAX_FILE,SERVER_PASSWORD
          # 새 색 컨테이너를 띄워 Traefik 경유 헬스체크가 통과한 뒤에만 구 색을 내린다 — 실패하면 구 색이 계속 서비스한다.
          script: |
            set -e
            export PATH=$PATH:/usr/local/bin
            SUDO() { echo "$SERVER_PASSWORD" | sudo -S "$@"; }
            ROUTER="${PROJECT_NAME}"
            # 컨테이너 삭제 시 남은 로그는 볼륨에 압축 보관 (#436), 30일 지난 것 정리
            # 보관본: {VOLUME_HOST_PATH}/logs/{컨테이너}-{yyyyMMdd-HHmmss}.log.gz
            LOG_DIR="${VOLUME_HOST_PATH}/logs"
            archive_logs() {
              SUDO mkdir -p "${LOG_DIR}"
              F="${LOG_DIR}/$1-$(date +%Y%m%d-%H%M%S).log.gz"
              SUDO sh -c "docker logs --timestamps '$1' 2>&1 | gzip > '${F}'" && echo "🗄️ $1 로그 보관: ${F}" || echo "⚠️ $1 로그 보관 실패 (배포는 계속)"
              SUDO find "${LOG_DIR}" -name '*.log.gz' -mtime +30 -delete 2>/dev/null || true
            }

            echo "📥 이미지 Pull: ${IMAGE}"
            SUDO docker pull "${IMAGE}"

            # 현재 서비스 중인 색 판별 (구 단일 컨테이너 passql-ai 는 이름이 달라 잡히지 않는다)
            ACTIVE=$(SUDO docker ps --filter "name=^${PROJECT_NAME}-(blue|green)$" --format '{{.Names}}' | head -1 || true)
            if [ "$ACTIVE" = "${PROJECT_NAME}-blue" ]; then NEW=green; OLD=blue; else NEW=blue; OLD=green; fi
            NEW_NAME="${PROJECT_NAME}-${NEW}"; OLD_NAME="${PROJECT_NAME}-${OLD}"
            echo "🎨 active=${ACTIVE:-none} → new=${NEW_NAME}"

            SUDO docker rm -f "${NEW_NAME}" 2>/dev/null || true
            SUDO mkdir -p "${VOLUME_HOST_PATH}"

            # drain 표식이 있으면 unhealthy → Traefik이 새 요청을 보내지 않는다
            HEALTH_CMD="[ -f /tmp/.pops-drain ] && exit 1; curl -fs -o /dev/null http://127.0.0.1:${CONTAINER_INTERNAL_PORT}${HEALTHCHECK_PATH}"

            echo "🐳 새 컨테이너 기동: ${NEW_NAME}"
            SUDO docker run -d \
              --name "${NEW_NAME}" \
              --restart unless-stopped \
              --log-driver json-file \
              --log-opt "max-size=${CONTAINER_LOG_MAX_SIZE}" \
              --log-opt "max-file=${CONTAINER_LOG_MAX_FILE}" \
              --health-cmd "${HEALTH_CMD}" \
              --health-interval 5s \
              --health-timeout 3s \
              --health-retries 3 \
              --health-start-period 60s \
              --network "${TRAEFIK_NETWORK}" \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.${ROUTER}.rule=Host(\`${SERVICE_DOMAIN}\`)" \
              --label "traefik.http.routers.${ROUTER}.entrypoints=${TRAEFIK_ENTRYPOINT}" \
              --label "traefik.http.services.${ROUTER}.loadbalancer.server.port=${CONTAINER_INTERNAL_PORT}" \
              -e TZ=Asia/Seoul \
              -v /etc/localtime:/etc/localtime:ro \
              -v "${VOLUME_HOST_PATH}:${VOLUME_CONTAINER_PATH}" \
              "${IMAGE}"

            # 컨테이너 자체 헬스(healthy)와 Traefik 경유 응답(200)이 모두 확인돼야 전환으로 본다
            OK=false
            for i in $(seq 1 ${HEALTHCHECK_MAX_RETRIES}); do
              sleep ${HEALTHCHECK_RETRY_INTERVAL}
              STATE=$(SUDO docker inspect --format '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{end}}' "${NEW_NAME}" 2>/dev/null || echo "missing/")
              if [ "${STATE%%/*}" = "exited" ]; then
                echo "❌ ${NEW_NAME} 종료됨 — 로그:"; SUDO docker logs --tail 200 "${NEW_NAME}"; exit 1
              fi
              CODE=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -H "Host: ${SERVICE_DOMAIN}" "http://localhost:${TRAEFIK_INTERNAL_PORT}${HEALTHCHECK_PATH}" || echo 000)
              if [ "${STATE#*/}" = "healthy" ] && [ "$CODE" = "200" ]; then
                echo "✅ 헬스체크 통과 (${i}회) state=${STATE} http=${CODE}"; OK=true; break
              fi
              echo "⏳ ${i}/${HEALTHCHECK_MAX_RETRIES} state=${STATE} http=${CODE}"
            done
            if [ "$OK" != "true" ]; then
              echo "❌ 헬스체크 타임아웃 — ${NEW_NAME} 로그 (구 색은 그대로 서비스 중):"
              SUDO docker logs --tail 200 "${NEW_NAME}"; SUDO docker rm -f "${NEW_NAME}" || true; exit 1
            fi

            # 구 색 정리: drain 표식 → in-flight 대기 → 제거
            if SUDO docker ps -a --format '{{.Names}}' | grep -qx "${OLD_NAME}"; then
              SUDO docker exec "${OLD_NAME}" touch /tmp/.pops-drain >/dev/null 2>&1 || true
              echo "⏱️ in-flight 대기 ${IN_FLIGHT_WAIT}초"; sleep ${IN_FLIGHT_WAIT}
              archive_logs "${OLD_NAME}"
              SUDO docker rm -f "${OLD_NAME}"
              echo "🗑️ ${OLD_NAME} 제거"
            fi

            # 구 단일 컨테이너(8098 직결)는 DSM 프록시를 8079로 옮긴 뒤 수동으로 지운다 — 자동 삭제하면 전환 전 장애가 난다
            if SUDO docker ps -a --format '{{.Names}}' | grep -qx "${PROJECT_NAME}"; then
              echo "⚠️ 구 컨테이너 ${PROJECT_NAME}(8098) 남아 있음 — DSM 프록시 전환 확인 후 수동 삭제"
            fi
            echo "✅ 무중단 배포 완료: active=${NEW_NAME} (https://${SERVICE_DOMAIN})"
