# passQL 소개 사이트 정적 서빙 (시놀로지 컨테이너 passql-site)
# 경로: DSM 리버스 프록시(80·443) > Traefik(localhost:8079) > 이 컨테이너 :80
# HTTPS 종료·HSTS 는 DSM 443 규칙이 담당 > 여기서는 리다이렉트·캐시·보안 헤더만

server {
    listen 80;
    server_name passql.suhsaechan.kr www.passql.suhsaechan.kr;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # 디렉터리 슬래시 보정(/sqld > /sqld/) 시 내부 포트·http 스킴이 Location 에 새지 않게 상대 경로
    absolute_redirect off;

    # www > 루트 (경로·쿼리 유지)
    if ($host = www.passql.suhsaechan.kr) {
        return 301 https://passql.suhsaechan.kr$request_uri;
    }
    # http > https (DSM 80 규칙이 X-Forwarded-Proto: http 를 붙여 넘김)
    if ($http_x_forwarded_proto = http) {
        return 301 https://passql.suhsaechan.kr$request_uri;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/xml text/xml text/plain image/svg+xml application/ld+json;

    error_page 404 /404.html;

    # HTML·디렉터리 주소: 5분 (내용 갱신이 바로 반영되도록 짧게)
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }

    # robots·sitemap: 1시간
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # 정적 자원(css·js·이미지·아이콘): 7일 (파일명에 해시가 없어 immutable 은 쓰지 않음)
    location ~* \.(css|js|png|jpg|jpeg|webp|gif|svg|ico|woff2?)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /404.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        internal;
    }
}
