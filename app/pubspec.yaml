name: passql_app
description: "passQL - SQL 학습 앱"
publish_to: none
version: 1.12.0+303
environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.1
  # 상태관리
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # 로컬 저장소
  # 네트워크 & 인증
  dio: ^5.9.0
  retrofit: 4.7.3
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^6.0.0
  uuid: ^4.5.2
  # UI/UX
  flutter_svg: ^2.2.1
  shimmer: ^3.0.0
  # 차트
  fl_chart: ^0.70.0
  # 외부 링크
  url_launcher: ^6.3.1
  # 알림
  # 실시간 통신
  # 기기 & 앱 정보
  package_info_plus: ^9.0.0
  # 12.4.0+ 는 iOS 26.1 SDK API(isiOSAppOnVision)를 써서 Xcode 26.0(CI)·16 에서 빌드 실패 > 12.3.0 고정
  device_info_plus: 12.3.0
  # 유틸리티
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7
  shared_preferences: ^2.5.5
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  firebase_messaging: ^16.7.0
  app_badge_plus: ^1.3.5
  # 광고 (AdMob). 9.1.0 은 iOS 에서 비공개 헤더(GoogleMobileAds_Beta.h)를 import 해 use_frameworks! 빌드 실패 > 9.0.0 고정 (#506)
  google_mobile_ads: 9.0.0
  app_tracking_transparency: ^2.0.7
  kakao_flutter_sdk_user: 2.0.1
  flutter_naver_login: 2.1.1
  flutter_web_auth_2: 5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  retrofit_generator: ^9.1.8
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png
    - assets/logo_dark.png
    # 오픈소스 라이선스 화면에 싣는 글꼴 라이선스 (OFL)
    - assets/fonts/JetBrainsMono-OFL.txt
    - assets/fonts/Pretendard-OFL.txt
  # 굵기 토큰(passql_typography.dart)이 쓰는 4종만 등록. 굵기를 추가하면 파일·토큰을 함께 추가
  fonts:
    - family: Pretendard-Regular
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
    - family: Pretendard-Medium
      fonts:
        - asset: assets/fonts/Pretendard-Medium.ttf
    - family: Pretendard-SemiBold
      fonts:
        - asset: assets/fonts/Pretendard-SemiBold.ttf
    - family: Pretendard-Bold
      fonts:
        - asset: assets/fonts/Pretendard-Bold.ttf
    # 코드 글꼴: 합자 없는 NL 판(SQL 의 <>, >=, != 를 기호 그대로 표시). 라이선스 assets/fonts/JetBrainsMono-OFL.txt
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNL-Regular.ttf
        - asset: assets/fonts/JetBrainsMonoNL-Bold.ttf
          weight: 700
flutter_launcher_icons:
  android: true
  ios: true
  # 정식 아이콘(#317 정사각형 로고). 교체할 때는 이 파일만 바꾸고 `dart run flutter_launcher_icons` 로 다시 생성한다.
  image_path: "assets/app_icon_1024.png"
  adaptive_icon_background: "#060C26"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  remove_alpha_ios: true
